    passHours(1); render();
  },
  pickChar(k) { if (!J.chars[k]) return; J.char = k; saveJournal(); render(); }
});

function outWeight() { const o = S.sv.out; return o ? Object.entries(o.bag).reduce((a, [k, q]) => a + outW(k) * q, 0) : 0; }
function bringHome(bag) {
  const sv = S.sv, got = [];
  for (const [k, q] of Object.entries(bag)) {
    if (k === 'bp') {
      for (let i = 0; i < q; i++) {
        const locked = Object.keys(RECIPES).filter(r => !RECIPES[r].base && !sv.recipes.includes(r));
        if (locked.length) { const r = pick(locked); sv.recipes.push(r); J.recipes[r] = true; saveJournal(); got.push('圖紙「' + RECIPES[r].n + '」'); }
        else { sv.st.plastic = (sv.st.plastic || 0) + 2; got.push('塑膠×2（圖紙都有了）'); }
      }
      continue;
    }
    let fit = q;
    if (k !== 'wu' && ITEMS[k].cat !== 'equip') fit = fitUnits(k, q);
    if (fit < q) got.push(ITEMS[k].n + '×' + (q - fit) + '（倉庫放不下，丟在門口）');
    if (!fit) continue;
    if (k === 'wu') sv.st.wu += fit; else sv.st[k] = (sv.st[k] || 0) + fit;
    got.push(ITEMS[k].n + '×' + fit);
  }
  slog(got.length ? '平安回家，帶回 ' + got.join('、') + '。' : '空手回家。');
  if (bag.drone) newOffers();
}
function ambush() {
  const sv = S.sv, o = sv.out;
  hurt(20, 'ambush'); sv.mor = clamp(sv.mor - 10);
  for (const k of Object.keys(o.bag)) { o.bag[k] = Math.floor(o.bag[k] / 2); if (!o.bag[k]) delete o.bag[k]; }
  slog('動靜太大，被屍群包圍了！你丟下一半的東西逃回家，生命 -20。', true);
  chron(sv.day, '在' + LOCS[o.loc].n + '被屍群包圍，負傷逃回。', 'bad');
  if (checkDeath()) return;
  bringHome(o.bag);
  sv.out = null;
  passHours(LOCS[o.loc].trip);
}

function viewOut() {
  const sv = S.sv, o = sv.out, L = LOCS[o.loc], Lst = sv.locs[o.loc];
  const w = outWeight(), cap = bagCap();
  let h = sceneSVG(o.loc) + '<div class="place"><h2>' + L.n + '</h2><span class="sub">探索等級 ' + expLevel(sv.xp) + '</span></div>';

    '<p class="empty">' + Math.round(o.exp) + '% · 滿 100% 會被屍群包圍，丟掉一半東西、生命 -20。' + (sv.hour >= 18 ? '<b style="color:var(--stamp)">天黑了，暴露值漲兩倍。</b>' : '') + '</p>';
  h += '<div class="cat">可以搜的地方（每處 1 小時）</div><div class="sheet">';

  }

  const items = Object.entries(o.bag);
  h += items.length ? '<div class="sheet">' + items.map(([k, q]) => '<div class="item"><div><div class="nm">' + (k === 'bp' ? '圖紙' : ITEMS[k].n) + '</div></div><div class="price">×' + q + '</div></div>').join('') + '</div>' : '<p class="empty">還沒找到東西。</p>';
  h += '<div class="row-btns"><button class="btn red" data-a="goHome">回家（' + L.trip + ' 小時）</button></div>';
  return h;
}

function viewOutside() {
  const sv = S.sv, lv = expLevel(sv.xp);
  let h = '<div class="cat">外出搜刮（探索等級 ' + lv + '，經驗 ' + sv.xp + (lv < 4 ? '/' + EXP_LV[lv] : '') + '）</div><div class="sheet">';
  if (S.mods && S.mods.noOut) h += '<p class="empty">挑戰條件「足不出戶」：這輪不能外出。</p>';

    if (!sv.locs[k]) sv.locs[k] = { done: [] };
    const left = L.cont.length - sv.locs[k].done.filter(x => /^\d$/.test(x)).length;
    const locked = lv < L.lv;
    const noNoise = L.noise && !(sv.st.noise > 0);
    h += actRow(L.n, locked ? '探索等級 ' + L.lv + ' 才能去' : '單程 ' + L.trip + ' 小時 · 還有 ' + left + ' 處沒搜 · 體力 -' + staCost(10) + (L.noise ? ' · 要用 1 個噪音器（有 ' + (sv.st.noise || 0) + '）' : '') + (sv.st.radar > 0 ? ' · 雷達' + (sv.power >= 1 ? '可用' : '沒電') : ''), '出門', 'goOut', k, !locked && !noNoise && canAct(L.trip + 1, staCost(10)));
  }

  if (z.state === 'asking') {

    soc += actRow('幫隔壁的 Zoe', z.today ? '今天已經給過了（' + z.given + '/7）' : '她想要：' + ITEMS[z.want].n + ' · 已幫 ' + z.given + '/7 · 連續 3 天沒幫她就會不見', '給她', 'zoe', '', !z.today && have);

  soc += viewAllies() + viewExtraSocial();
  if (soc) h += '<div class="cat">其他倖存者</div><div class="sheet">' + soc + '</div>';
  // 交易
  h += '<div class="cat">無人機交易</div>';
  if (!(sv.st.drone > 0)) h += '<p class="empty">沒有無人機。聽說學校的教師辦公室有一台教學用的。</p>';
  else {
    h += '<div class="sheet">' + (sv.offers.length ? sv.offers.map((o, i) => actRow(ITEMS[o.give[0]].n + '×' + o.give[1] + ' → ' + ITEMS[o.get[0]].n + '×' + o.get[1], o.done ? '已完成' : '你有 ' + (o.give[0] === 'wu' ? sv.st.wu : sv_has(o.give[0])) + ' 個', o.done ? '完成' : '交換', 'trade', String(i), !o.done && sv_has(o.give[0]) >= o.give[1])).join('') : '<p class="empty">今天沒有人回應，明天再試。</p>') + '</div>';
    h += '<p class="empty">每天早上換一批。已完成 ' + sv.trades + ' 次交易' + (sv.trades < 5 ? '，滿 5 次後對方願意給柴油。' : '。') + '</p>';
  }
  if (sv.st.juicer > 0) h += '<div class="sheet">' + actRow('榨果汁', '2 份蔬果 → 1 瓶果汁 · 1 小時 · 交易的熱門貨', '榨', 'juice', '', vegPool() >= 2 && canAct(1, staCost(3))) + '</div>';
  return h;
}

function viewChars() {
  const cur = J.char || 'neighbor';
  return '<div class="cat">角色</div><div class="sheet">' + Object.entries(CHARS).map(([k, c]) => {

      '<button class="btn ghost" data-a="pickChar" data-v="' + k + '"' + (!open || cur === k ? ' disabled' : '') + '>選</button></div>';
  }).join('') + '</div>';
}

function m6Init(sv) {
  sv.floors = ['1F']; sv.rooms = []; sv.defXp = 0; sv.crafted = 0; sv.clues = []; sv.endless = false;
}
const roomN = k => (S.sv.rooms || []).filter(r => r === k).length;
const defLv = () => lvOf(S.sv.defXp || 0, DEF_LV);
const craftLv = () => lvOf(S.sv.crafted || 0, CRAFT_LV);
const powerMul = () => roomN('powerroom') ? 1.2 : 1;
function storeCap() { return 200 + roomN('storage') * 150; }
function storeWeight() { const st = S.sv.st; return Object.entries(st).reduce((a, [k, q]) => a + (k === 'wu' || !ITEMS[k] || ITEMS[k].cat === 'equip' ? 0 : ITEMS[k].w * q), 0); }
function craftHours(h) { return Math.max(1, h - (roomN('workshop') ? 1 : 0) - (craftLv() >= 3 ? 1 : 0)); }
function craftSta(h) { return Math.round(staCost(8 * h) * (craftLv() >= 2 ? 0.75 : 1)); }
function roomSlots() { return S.sv.floors.length * 3; }

Object.assign(SACT, {
  buildFloor(k) {
    const sv = S.sv, f = FLOORS[k];
    if (!f || sv.floors.includes(k) || !Object.entries(f.need).every(([m, n]) => (sv.st[m] || 0) >= n) || !canAct(f.h, staCost(30))) return;

    chron(sv.day, '擴建' + f.n + '。', 'good');
    passHours(f.h); render();
  },
  buildRoom(k) {
    const sv = S.sv, r = ROOMS[k];
    if (!r || sv.rooms.length >= roomSlots() || !Object.entries(r.need).every(([m, n]) => (sv.st[m] || 0) >= n) || !canAct(r.h, staCost(15))) return;
    for (const [m, n] of Object.entries(r.need)) { sv.st[m] -= n; if (!sv.st[m]) delete sv.st[m]; }
    sv.rooms.push(k); sv.sta -= staCost(15);
    slog('蓋好了' + r.n + '：' + r.d + '。');

  brew() {

      else for (let i = 0; i < 4; i++) s += r(x + W * 0.26 + i * W * 0.13, y + H * 0.32, W * 0.08, H * 0.36, i % 2 ? '#ecd27a' : '#e8edf2', 1, ' stroke="none"');

      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.4; s += l(cx, cy, cx + Math.cos(a) * m * 0.3, cy + Math.sin(a) * m * 0.3, '#9aa7b4', 2.4); }
      s += c(cx, cy, 2.4, '#5d6b7a');
      break;
    case 'heater':
      s += r(x, y, W, H, '#7d3a2e', 4);
      s += r(x + 5, y + 5, W - 10, H - 10, '#3a1c16', 3);
      for (let i = 0; i < 4; i++) s += l(x + 8, y + 8 + i * (H - 16) / 3, x + W - 8, y + 8 + i * (H - 16) / 3, '#f08a3a', 1.8);
      break;
    case 'lightbox': case 'greenhouse': {
      s += r(x, y, W, H, k === 'lightbox' ? '#6b5a48' : '#cfeedd', 3);
      if (k === 'greenhouse') { s += r(x + 3, y + 3, W - 6, H - 6, '#e9f8ef', 2); s += l(cx, y + 2, cx, y + H - 2, '#9cc9ae', 1); }
      s += r(x + 4, y + 5, W - 8, H - 10, '#5a3e2a', 2);
      const n = Math.max(2, Math.round(W / 14));
      for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) s += topSprout(x + 8 + i * (W - 16) / (n - 1), y + H * (0.42 + j * 0.3), 1, '#4e9d4e');
      if (k === 'lightbox') s += r(x + 2, y + 1, W - 4, 3, '#c98cf0', 1.5, ' stroke="none" opacity="0.9"');

    }
    case 'potrack':
      s += r(x, y, W, H, '#a37d55', 2);
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const px = x + W * (0.28 + i * 0.44), py = y + H * (0.3 + j * 0.42); s += c(px, py, m * 0.17, '#c46a3a') + c(px, py, m * 0.12, '#5a3e2a', ' stroke="none"') + topSprout(px, py + 2, 0.8); }
      break;
    case 'pedal':
      s += e(cx, cy, W * 0.14, H * 0.42, '#2a2d31');
      s += r(cx - 3, y + H * 0.25, 6, H * 0.5, '#5d6b7a', 2);
      s += e(cx, y + H * 0.66, W * 0.13, H * 0.09, '#222');
      s += l(x + W * 0.22, y + H * 0.2, x + W * 0.78, y + H * 0.2, '#3a3f45', 3);
      s += r(x + W * 0.28, y + H * 0.8, W * 0.44, 4, '#ecd27a', 2);
      break;
    case 'juicer':
      s += r(x + 3, y + 3, W - 6, H - 6, '#f6c650', 6);
      s += c(cx, cy, m * 0.3, '#fff3c4') + c(cx, cy, m * 0.12, '#f2a33a');
      break;
    case 'brewer':
      s += c(x + W * 0.38, y + H * 0.42, m * 0.3, '#9c7350') + c(x + W * 0.38, y + H * 0.42, m * 0.22, 'none', ' stroke="#5a3e2a" stroke-width="1.6"');
      s += c(x + W * 0.38, y + H * 0.42, m * 0.06, '#5a3e2a');
      s += p('M' + (x + W * 0.62) + ' ' + (y + H * 0.42) + ' q ' + W * 0.2 + ' 0 ' + W * 0.2 + ' ' + H * 0.3, 'none', ' stroke="#c7783a" stroke-width="3" stroke-linecap="round"');
      s += r(x + W * 0.68, y + H * 0.72, W * 0.22, H * 0.18, '#7aa7c7', 2);
      break;
    case 'refinery':
      s += r(x, y, W, H, '#5b5f68', 3);
      s += c(x + W * 0.25, cy, m * 0.32, '#8a919c') + c(x + W * 0.25, cy, m * 0.16, '#3b3f45');
      s += c(x + W * 0.62, cy, m * 0.26, '#8a919c') + c(x + W * 0.62, cy, m * 0.1, '#3b3f45');
      s += l(x + W * 0.25 + m * 0.32, cy - 3, x + W * 0.62 - m * 0.26, cy - 3, '#c7783a', 3);
      s += r(x + W * 0.84, y + 4, 6, H - 8, '#e0b13a', 2);
      break;
    case 'radar':
      s += r(x + 4, y + 4, W - 8, H - 8, '#3e6455', 3);
      s += c(cx, cy, m * 0.36, '#d8e2dc');
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; s += l(cx, cy, cx + Math.cos(a) * m * 0.34, cy + Math.sin(a) * m * 0.34, '#9fb4a8', 0.8); }
      s += c(cx, cy, 3, '#4f7d6a') + c(cx + m * 0.18, cy - m * 0.12, 1.8, '#ff6b5a', ' stroke="none"');
      break;
    case 'bot_farm': case 'bot_fix': case 'bot_cook': {
      const col = { bot_farm: '#9fc3e0', bot_fix: '#e0b39f', bot_cook: '#e0d59f' }[k];
      s += c(cx, cy, m * 0.4, col) + c(cx, cy, m * 0.28, '#f3f0e6');
      s += r(cx - m * 0.2, cy - m * 0.08, m * 0.4, m * 0.14, '#1d2733', 3);
      s += c(cx - m * 0.08, cy - 0.5, 1.6, '#6ff0ff', ' stroke="none"') + c(cx + m * 0.08, cy - 0.5, 1.6, '#6ff0ff', ' stroke="none"');
      break;
    }
    case 'shelf': case 'storage': {
      s += r(x, y, W, H, k === 'shelf' ? '#b89a6a' : '#8f7350', 2);
      const n = k === 'shelf' ? 2 : 4;
      const box = ['#c9a36a', '#7aa7c7', '#d36b5a', '#8fbf6a', '#e0c25a'];
      for (let i = 0; i < n; i++) {
        const bx = x + 4 + i * (W - 8) / n, bw = (W - 8) / n - 3;
        s += r(bx, y + 4, bw, H * 0.42, box[i % 5], 1.5);
        s += r(bx + 1, y + H * 0.52, bw - 2, H * 0.36, box[(i + 2) % 5], 1.5);
        s += l(bx + 2, y + 4 + H * 0.21, bx + bw - 2, y + 4 + H * 0.21, 'rgba(0,0,0,0.25)', 1);
      }
      break;
    }
    default:
      return null;
  }
  return s;
}

function topFront(k, x, y, W, H) {
  if (H < 6) return '';
  const { r, l, c } = TA;
  switch (k) {
    case 'microwave': return r(x + 4, y + 2, W * 0.6, H - 4, '#2f3a44', 1.5) + c(x + W * 0.82, y + H / 2, 1.8, '#46d16a', ' stroke="none"');
    case 'freezer': return l(x + 4, y + 3, x + W - 4, y + 3, '#a9bccb', 1);
    case 'battery': return r(x + W / 2 - 5, y + 2, 10, Math.max(2, H - 4), '#2c3a46', 1.5);
    case 'storage': case 'shelf': return l(x + W / 2, y + 1, x + W / 2, y + H - 1, 'rgba(0,0,0,0.35)', 1) + c(x + W / 2 - 3, y + H / 2, 1.3, '#ecd27a', ' stroke="none"') + c(x + W / 2 + 3, y + H / 2, 1.3, '#ecd27a', ' stroke="none"');

    default: return '';

}

function trackCodex() {
  if (!S) return;
  let changed = false;
  J.seen = J.seen || {}; J.ach = J.ach || {};
  const mark = bag => { for (const k of Object.keys(bag || {})) if (ITEMS[k] && !J.seen[k]) { J.seen[k] = true; changed = true; } };
  mark(S.carry); mark(S.home);
  if (S.sv) { mark(S.sv.st); for (const f of S.sv.fresh) if (!J.seen[f.k]) { J.seen[f.k] = true; changed = true; } if (S.sv.out) mark(S.sv.out.bag); }
  for (const [id, n, , cond] of ACHS) {
    if (J.ach[id]) continue;
    let ok = false; try { ok = cond(); } catch (e) {}
    if (ok) {
      J.ach[id] = true; changed = true;
      const msg = '成就達成：「' + n + '」';
      if (S.sv && S.phase === 'survive') slog(msg, true); else if (S.log) log(msg, true);
      if (typeof sfx === 'function') sfx('ach');
    }
  }
  if (changed) saveJournal();
}

/* ---------- 背景音樂：準備期緊張的脈動、白天安靜的和聲、屍潮夜低沉的嗡鳴 ---------- */
const MUS = { timer: null, next: 0, bar: 0, master: null };
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicMood() {
  if (!S) return 'calm';
  if (S.phase === 'play') return 'tense';
  if (S.phase === 'survive') return hordeOn(S.sv.day) ? 'dark' : 'calm';
  return 'calm';
}
function note(f, t, len, wave, vol, attack) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + (attack || 0.02));
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(MUS.master); o.start(t); o.stop(t + len + 0.05);
}
const CALM = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const PENTA = [69, 72, 74, 76, 79, 81];
function scheduleBar(t, mood) {
  if (mood === 'calm') {
    const ch = CALM[MUS.bar % 4];
    ch.forEach(m => note(hz(m), t, 4.2, 'sine', 0.22, 1.2));
    note(hz(ch[0] - 12), t, 4.2, 'triangle', 0.18, 0.8);
    if (MUS.bar % 2 === 0) note(hz(PENTA[Math.floor(Math.random() * PENTA.length)]), t + 1 + Math.random() * 2, 1.6, 'sine', 0.08, 0.05);
    return 4;
  }
  if (mood === 'tense') {
    for (let i = 0; i < 4; i++) note(hz(33 + (MUS.bar % 4 === 3 && i > 1 ? 1 : 0)), t + i * 0.5, 0.35, 'triangle', 0.35, 0.01);
    for (let i = 0; i < 8; i++) note(2400, t + i * 0.25, 0.04, 'square', i % 2 ? 0.015 : 0.03, 0.002);
    if (MUS.bar % 2 === 0) note(hz(64 + (MUS.bar % 4)), t + 1.5, 0.45, 'sine', 0.06, 0.02);
    return 2;
  }
  // dark
  note(hz(29), t, 4.3, 'sawtooth', 0.12, 1.5);
  note(hz(41), t, 4.3, 'sine', 0.2, 1.5);
  if (MUS.bar % 2 === 1) { note(hz(64), t + 2, 1.8, 'sine', 0.05, 0.4); note(hz(65), t + 2.1, 1.8, 'sine', 0.04, 0.4); }
  return 4;
}
function musicTick() {
  if (J.music !== true || !AC) { musicStop(); return; }
  const now = AC.currentTime;
  if (MUS.next < now) MUS.next = now + 0.05;
  while (MUS.next < now + 0.6) { MUS.next += scheduleBar(MUS.next, musicMood()); MUS.bar++; }
}
function musicStart() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!MUS.master) {
      MUS.master = AC.createGain(); MUS.master.gain.value = 0.18;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      MUS.master.connect(lp).connect(AC.destination);
    }
    if (!MUS.timer) { MUS.next = 0; MUS.timer = setInterval(musicTick, 200); musicTick(); }
  } catch (e) {}
}
function musicStop() { if (MUS.timer) { clearInterval(MUS.timer); MUS.timer = null; } }
const _sfxBase = sfx;
sfx = function (type) { _sfxBase(type); if (J.music === true && !MUS.timer) musicStart(); };

/* ================= 一鍵籌備（開發用） =================

   → 裝修公司（大門、微波爐、太陽能、儲電站）→ 工具店 → 藥局 → 農貿 → 回家。

    const roomFor = k => ITEMS[k].cat === 'equip' ? 99 : Math.floor((capacity() - carried() + 1e-9) / Math.max(ITEMS[k].w, 0.01));
    const buy = (k, n, reserve) => {

      if (p > 0) q = Math.min(q, Math.floor((S.money - (reserve || 0)) / p));
      if (q <= 0) return 0;
      if (ITEMS[k].cat === 'equip' && !deliveryOk()) return 0;
      UI.qty[k] = Math.min(99, q);
      const before = (S.home[k] || 0) + (S.carry[k] || 0);

      buy('sausage', 20, rs); buy('noodle', 20, rs);

    if (deliveryOk() && go('reno')) {

  if (!['hit', 'bash', 'fire', 'knock', 'squeak', 'groan', 'pop', 'fix', 'eat'].includes(type)) return _sfxBaseSg(type);
  if (J.sound === false) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const tone = (f, st, len, wave, vol, f2) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = wave || 'sine'; o.frequency.setValueAtTime(f, t0 + st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + st + len); g.gain.setValueAtTime(0.0001, t0 + st); g.gain.exponentialRampToValueAtTime(vol || 0.08, t0 + st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + len); o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + len + 0.02); };

  if (sv.hp < 40) L.push('傷口好痛', '要找藥了');
  if (sv.hour >= 22) L.push('該睡了……', '好睏');
  if (hordeOn(sv.day)) L.push('今晚會很難熬', '門夠不夠堅固？');
  if (inCold(sv.day)) L.push('好冷……');
  if (inRain(sv.day)) L.push('雨一直下');
  if ((sv.broken || {}) && Object.keys(sv.broken || {}).length) L.push('那台東西得修一修');
  if (!L.length) L.push('今天也要活下去', '外面好安靜', '要不要出去找點東西？', '嗯……來整理一下', '想念以前的日子', '收音機今天會不會有消息');

}
function say(txt, ms) { const rt = rtState(); rt.say = { txt, until: performance.now() + (ms || 3500) }; }

/* ---------- 2. 目標清單 ---------- */
const GOALS = [
  { id: 'look', n: '查看冰櫃或櫃子' },
  { id: 'eat', n: '吃一頓飯' },
  { id: 'gen', n: '發一次電' },
  { id: 'reinforce', n: '加固大門' },
  { id: 'plant', n: '種下種子' },

  { id: 'horde', n: '撐過第一次屍潮', chk: sv => sv.htSurv && Object.keys(sv.htSurv).length > 0 },
  { id: 'evRepair', n: '修好故障的設備' },
  { id: 'kill', n: '打倒 5 隻殭屍', chk: sv => (sv.kills || 0) >= 5 },
  { id: 'day7', n: '活過第 7 天', chk: sv => sv.day >= 7 },
  { id: 'zoe', n: '幫隔壁的 Zoe 一次', chk: sv => sv.zoe && sv.zoe.given > 0 },
  { id: 'day30', n: '活過第 30 天', chk: sv => sv.day >= 30 }
];
function goalState() { const sv = S.sv; if (!sv.goals) sv.goals = {}; return sv.goals; }
function goalDone(id) {
  const g = goalState(); if (g[id]) return;
  const G = GOALS.find(x => x.id === id); if (!G) return;
  g[id] = true; S.sv.mor = clamp(S.sv.mor + 5);
  slog('目標完成：「' + G.n + '」心態 +5。'); sfx('ach');
  if (typeof evState === 'function') { const E = evState(), rt = rtState(); E.fx = (E.fx || []).concat([{ x: rt.pos.x, y: rt.pos.y - 0.4, txt: '☑ ' + G.n, col: '#7cc191', t0: performance.now() }]); }
}
function goalCheck() { const sv = S.sv, g = goalState(); for (const G of GOALS) if (!g[G.id] && G.chk && G.chk(sv)) goalDone(G.id); }
for (const k of ['eat', 'eatFull', 'gen', 'pedal', 'reinforce', 'plant', 'evRepair']) {
  const f = SACT[k]; if (!f) continue;
  SACT[k] = function (v) { const sv = S.sv, h = sv.hour, d = sv.day, l = sv.log[0]; f(v); if (S.phase === 'survive' && (sv.hour !== h || sv.day !== d || sv.log[0] !== l)) goalDone(k === 'eatFull' ? 'eat' : k === 'pedal' ? 'gen' : k); };
}

  if (!left.length) return '';

}
// 殭屍擊倒數
const _siegeHitG = siegeHit;
siegeHit = function (id) { const sg = siegeOf(), k0 = sg ? sg.kills : 0; _siegeHitG(id); const sg2 = siegeOf(); if (sg2 && sg2.kills > k0) S.sv.kills = (S.sv.kills || 0) + (sg2.kills - k0); };

/* ---------- 3. 狗 ---------- */
const hasDog = () => S.sv.dog && S.sv.dog.state === 'pet';
function dogState() { const rt = rtState(); if (!rt.dog) rt.dog = { x: rt.pos.x + 0.6, y: rt.pos.y + 0.3, f: rt.pos.f, pet: -99 }; return rt.dog; }
Object.assign(SACT, {
  petDog() {

  }
});

/* ---------- 4. 燈 ---------- */
const isDark = h => h >= 19 || h < 6;
Object.assign(SACT, {
  lightSw() {

    sv.light = !sv.light; sfx('click'); slog(sv.light ? '打開燈，房間亮了起來（每小時 0.1 度電）。' : '關燈了。'); render();

/* ---------- 每一格 ---------- */
let LF_SAY = 0, LF_HOUR = null;
function lifeTick(now) {
  requestAnimationFrame(lifeTick);
  if (!rtActive() || document.querySelector('.anim.day')) return;
  const sv = S.sv, rt = rtState(), sp = RT_SPEEDS[UIS.speed] || 0;
  // 每小時：燈耗電、夜裡有燈心態 +1、檢查目標

  if (LF_HOUR !== hk) {

  }

    const tx = rt.pos.x + 0.7, ty = rt.pos.y + 0.35, dx = tx - d.x, dy = ty - d.y, dist = Math.hypot(dx, dy);
    if (dist > 0.35) { const st = Math.min(dist - 0.3, 0.016 * 2.4 * Math.max(1, Math.min(sp || 1, 3)) * (dist > 2 ? 2 : 1)); d.x += dx / dist * st; d.y += dy / dist * st; d.moving = true; } else d.moving = false;
    d.face = dx >= 0 ? 1 : -1;

requestAnimationFrame(lifeTick);
// 角色動作圖：走路兩張輪流、做事、站著；往右走時翻面
let CF_LAST = { x: null };
function charFrame(now) {
  const img = document.getElementById('char-img'); if (!img) return;
  const rt = rtState(), walking = rt.path && rt.path.length;
  if (CF_LAST.x != null && Math.abs(rt.pos.x - CF_LAST.x) > 0.001) rt.face = rt.pos.x > CF_LAST.x ? 1 : -1;
  CF_LAST.x = rt.pos.x;
  const k = walking ? (Math.floor(now / 200) % 2 ? 'char_walk1' : 'char_walk2') : ((rt.task && rt.task.h) || (rt.workUntil && now < rt.workUntil)) ? 'char_work' : 'char_idle';
  const flip = rt.face === 1;
  if (k !== img.dataset.k) { img.setAttribute('href', SPR[k]); img.dataset.k = k; }
  if (flip !== (img.dataset.flip === '1')) { if (flip) img.setAttribute('transform', 'scale(-1 1)'); else img.removeAttribute('transform'); img.dataset.flip = flip ? '1' : '0'; }
}

function lifeLayer(now) {

  now = now || performance.now();

    if (sv.light) s += '<rect x="0" y="0" width="' + Z.w + '" height="' + Z.h + '" fill="#ffe2a0" opacity="0.32" style="mix-blend-mode:screen" pointer-events="none"/>';

        '<path d="M-9 -7 q -4 ' + (-4 + wag).toFixed(1) + ' -6 ' + (-8 + wag).toFixed(1) + '" stroke="#a0764a" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="-6" y="-2" width="2.4" height="4" fill="#7a5a3a"/><rect x="4" y="-2" width="2.4" height="4" fill="#7a5a3a"/>') +

document.addEventListener('pointerdown', e => {

/* ---------- 5. 長按搬家 ---------- */
let LP_T = null, LP_FIRED = false;
document.addEventListener('pointerdown', e => {

  const t = e.target.closest && e.target.closest('[data-a="rtObj"]');

  if (!o || (ISO[o.k] && ISO[o.k].fixed && ['bed', 'toilet'].includes(o.k) && false)) return;

document.addEventListener('pointermove', e => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 6) clearTimeout(LP_T); }, true);
document.addEventListener('click', e => { if (LP_FIRED) { LP_FIRED = false; e.stopPropagation(); e.preventDefault(); } }, true);
const _rtTileMove = SACT.rtTile;
SACT.rtTile = function (v) {

Object.assign(SACT, { moveCancel() { if (UI.iso) { UI.iso.moving = false; UI.iso.sel = null; } render(); }, moveRot() { SACT.isoRotate(); } });

/* ---------- 掛進場景與面板 ---------- */
const _rtSceneLife = rtScene;
rtScene = function () {

  const gh = goalHTML();

};
const _rtPanelLife = rtPanel;

};

/* ================= 事件綁定 ================= */
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.getAttribute('data-a');
  sfx(a === 'buy' ? 'buy' : a === 'sleep' || a === 'watch' ? 'sleep' : 'click');
  if (typeof queueIntercept === 'function' && queueIntercept(a, b.getAttribute('data-v'))) return;
  if (ACT[a]) ACT[a](b.getAttribute('data-v'));
  else if (SACT[a]) SACT[a](b.getAttribute('data-v'));
});

// 數量直接輸入：只更新數值、不重畫，避免手機上點「買」時按鈕被重畫吃掉
function setQtyFromInput(el) {

}

$app.addEventListener('keydown', e => {

}

if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

// 給測試用
window.__slog = { get S() { return S; }, ACT, get SACT() { return SACT; }, hordeType, HORDES, hordeOn: d => hordeOn(d), render: () => render(), get UI() { return UI; }, get UIS() { return UIS; } };
})();

<style>
/* 版面概念：一本攤開的方格求生筆記本，倒數計時像蓋在頁首的紅色印章 */
:root {
  --paper: #f3f0e6;
  --paper-2: #e9e4d6;
  --grid: rgba(60, 90, 120, 0.09);
  --ink: #1d2733;
  --muted: #5f6873;
  --line: #c6c1b2;
  --stamp: #b8322a;
  --tape: #ecd27a;
  --good: #2f6b3f;
  --warn: #a8661a;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* 頂部狀態 */
.status {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  padding: 10px 16px 8px;
}
.status-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.stamp {
  border: 2.5px solid var(--stamp); color: var(--stamp);
  border-radius: 6px; padding: 2px 10px 4px; transform: rotate(-2deg);
  text-align: center; min-width: 116px;
}
.stamp .lbl { font-family: var(--f-display); font-size: 12px; letter-spacing: 0.15em; }
.stamp .big { font-family: var(--f-num); font-size: 30px; font-weight: 700; line-height: 1; }
.stamp.urgent { background: var(--stamp); color: var(--paper); }
.meters { display: grid; gap: 4px; font-size: 13px; }
.meters .row { display: flex; justify-content: space-between; gap: 8px; }
.meters .k { color: var(--muted); }
.bar { height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--paper-2); }
.bar > i { display: block; height: 100%; background: var(--ink); }
.bar.full > i { background: var(--stamp); }

.ticker { margin: 12px 0 4px; display: grid; gap: 4px; }
.ticker p { margin: 0; font-size: 13px; color: var(--muted); }
.ticker p:first-child { color: var(--ink); }
.ticker p.alert { color: var(--stamp); font-weight: 700; }

.place { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
.place h2 { font-size: 26px; }
.place .sub { color: var(--muted); font-size: 13px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--ink); display: grid; grid-template-columns: repeat(4, 1fr);
}
.tabs button { background: none; border: 0; color: var(--paper-2); padding: 12px 4px 14px; font-size: 14px; }
.tabs button[aria-selected="true"] { color: var(--tape); font-weight: 700; box-shadow: inset 0 3px 0 var(--tape); }

.sheet { background: rgba(255,255,255,0.55); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 700; }
.item .meta { font-size: 12.5px; color: var(--muted); }
.item .price { font-family: var(--f-num); font-weight: 700; text-align: right; }
.price.free { color: var(--good); }
.price.up { color: var(--stamp); }
.item .ctrl { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.step { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; }
.step button { background: none; border: 0; width: 32px; height: 32px; font-size: 18px; }
.step span { min-width: 30px; text-align: center; align-self: center; font-family: var(--f-num); }
.qty-in { width: 46px; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: transparent; text-align: center; font-family: var(--f-num); font-size: 16px; color: var(--ink); -moz-appearance: textfield; appearance: textfield; }
.qty-in::-webkit-outer-spin-button, .qty-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty-in:focus { outline: 2px solid var(--stamp); outline-offset: -2px; }
.btn { border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 6px 14px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.red { background: var(--stamp); border-color: var(--stamp); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.tag { display: inline-block; font-size: 11.5px; border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
.tag.red { color: var(--stamp); }
.tag.green { color: var(--good); }
.tag.amber { color: var(--warn); }

.cat { font-family: var(--f-display); font-size: 16px; margin: 16px 0 6px; }
.cat::before { content: ""; display: inline-block; width: 14px; height: 10px; background: var(--tape); margin-right: 6px; transform: skew(-12deg); }

.map svg { width: 100%; height: auto; display: block; }
.dest { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.dest:last-child { border-bottom: 0; }
.dest .meta { font-size: 12.5px; color: var(--muted); }
.dest .meta b { color: var(--stamp); }

.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.kv > div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: rgba(255,255,255,0.55); }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-family: var(--f-num); font-size: 20px; font-weight: 700; }
.kv .v.bad { color: var(--stamp); }
.list { margin: 0; padding-left: 20px; }
.list li { margin: 4px 0; }
.note { font-family: var(--f-display); font-size: 16px; line-height: 1.7; }
.hand { font-family: var(--f-display); }
.empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }

.hero { padding: 36px 0 12px; }
.hero h1 { font-size: 44px; line-height: 1.1; }
.hero h1 span { color: var(--stamp); }
.hero p { max-width: 34em; }
.result-big { font-family: var(--f-num); font-size: 64px; font-weight: 700; line-height: 1; }
.result-big small { font-family: var(--f-display); font-size: 22px; margin-left: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.timeline li .d { font-family: var(--f-num); color: var(--muted); }
.timeline li.bad { color: var(--stamp); }
.timeline li.good .d { color: var(--good); }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.upg:last-child { border-bottom: 0; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.meters.sv { gap: 3px; }
.meters.sv .m { display: grid; grid-template-columns: 32px 1fr 26px; gap: 6px; align-items: center; font-size: 12px; }
.meters.sv .m .num { text-align: right; }
.meters.sv .bar { height: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
.chips b { color: var(--ink); }
.alert-line { color: var(--stamp); font-weight: 700; font-size: 14px; margin: 8px 0; }
.dev { margin-top: 18px; font-size: 13px; color: var(--muted); }
.dev label { display: inline-flex; gap: 6px; align-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .stamp.urgent { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: rotate(-2deg) scale(1.04); } }
}
@media (max-width: 400px) {
  .hero h1 { font-size: 36px; }
  .stamp { min-width: 100px; }
  .stamp .big { font-size: 26px; }
}
</style>
</head>

function clock(t) { const m = ((480 + t) % 1440 + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function dur(m) { m = Math.max(0, Math.round(m)); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function count(bag) { return Object.values(bag).reduce((a, b) => a + b, 0); }
function weightOf(bag) { return Object.entries(bag).reduce((a, [k, q]) => a + ITEMS[k].w * q, 0); }
function add(bag, k, q) { bag[k] = (bag[k] || 0) + q; if (bag[k] <= 0) delete bag[k]; }

/* ================= 一輪開始 ================= */
function newRun() {
  if (J.saveOverNote) { J.saveOverNote = false; saveJournal(); }
  const bonusT = J.upg.time * 30;
  const stock = {};
  for (const id of STORE_ORDER) {
    const st = STORES[id];
    if (!st.items) continue;
    stock[id] = {};
    for (const [k, v] of Object.entries(st.items)) stock[id][k] = v[1];
  }
  S = {
    phase: 'play', t: -bonusT, money: 1070 + J.upg.money * 150 + ((J.char || 'neighbor') === 'student' ? 100 : 0), loc: 'home', char: J.char || 'neighbor',
    car: false, loan: false, carry: {}, home: {}, sold: {}, stock,
    fired: {}, log: [], seenStores: { home: true }, result: null
  };
  UI = { tab: 'here', qty: {} };
  log('你從惡夢中驚醒。這次你知道：今天 18:00，城市會被屍群淹沒。', true);
  if (bonusT) log('你提早 ' + bonusT + ' 分鐘醒來。');
  render();
}

function log(txt, alert) { S.log.unshift({ txt, alert: !!alert, t: S.t }); S.log = S.log.slice(0, 30); }

function capacity() { return BASE_BAG + J.upg.bag * 5 + (S.char === 'manager' ? 15 : 0) + (S.car ? CAR_TRUNK : 0); }
function carried() { return weightOf(S.carry); }

/* 時間推進，觸發事件 */
function advance(min) {
  const from = S.t;
  S.t += min;
  for (const ev of EVENTS) {
    if (ev.at > from && ev.at <= S.t && !S.fired[ev.id]) {
      S.fired[ev.id] = true;
      log(ev.txt, true);
      if (!ev.silentJournal && !J.events[ev.id]) { J.events[ev.id] = true; saveJournal(); }
      if (ev.id === 'panicEnd') {
        for (const k of Object.keys(S.stock.mart)) S.stock.mart[k] = Math.floor(S.stock.mart[k] / 2);
      }
      if (ev.id === 'waterOut') S.stock.conv.water = 0;
    }
  }
}

/* ================= 價格與規則 ================= */
function price(store, k) {
  const base = STORES[store].items[k][0];
  if (store === 'mart' && S.t >= 152 && S.t < 210) return 0;
  if (S.t >= 210 && (store === 'mart' || store === 'conv') && (ITEMS[k].cat === 'food' || ITEMS[k].cat === 'water')) return Math.ceil(base * 1.5);
  return base;
}
function isOpen(store, t) { const st = STORES[store]; return !st.closes || t < st.closes; }
function deliveryOk() { return S.t < 480; }

function travelTime(a, b) {
  const A = STORES[a], B = STORES[b];
  const d = Math.hypot(A.x - B.x, A.y - B.y);
  const walk = Math.round(d * 20);
  return S.car ? Math.round(walk * 0.5 + 5) : walk;
}

/* ================= 動作 ================= */
const ACT = {
  start() { commitRun(); newRun(); },
  tab(v) { UI.tab = v; render(); window.scrollTo(0, 0); },
  qty(v) {
    const [k, d] = v.split(':');
    const cur = UI.qty[k] || 1;
    UI.qty[k] = Math.max(1, Math.min(99, d === 'max' ? 99 : cur + Number(d)));
    render();
  },
  buy(k) {
    const store = S.loc;
    const it = ITEMS[k];
    if (!isOpen(store, S.t)) return;
    let want = UI.qty[k] || 1;
    const p = price(store, k);
    const stock = S.stock[store][k];
    want = Math.min(want, stock);
    if (p > 0) want = Math.min(want, Math.floor(S.money / p));
    if (it.cat === 'equip') {
      if (!deliveryOk()) { log('送貨車已經停駛，設備送不到了。', true); render(); return; }
    } else {
      const room = capacity() - carried();
      want = Math.min(want, it.w > 0 ? Math.floor((room + 1e-9) / it.w) : want);
    }
    if (want <= 0) {
      if (stock <= 0) log(it.n + ' 賣完了。');
      else if (p > 0 && S.money < p) log('錢不夠。');
      else log('拿不動了，先回家放東西。');
      render(); return;
    }
    S.money -= p * want;
    S.stock[store][k] -= want;
    if (it.cat === 'equip') { add(S.home, k, want); log('買了 ' + it.n + ' ×' + want + '，會送到家。'); }
    else { add(S.carry, k, want); log((p === 0 ? '搶到 ' : '買了 ') + it.n + ' ×' + want + (p ? '，花 ' + money(p * want) : '') + '。'); }
    UI.qty[k] = 1;
    advance(2);
    checkOutbreak();
    render();
  },
  go(dest) {
    const tt = travelTime(S.loc, dest);
    log('前往 ' + STORES[dest].n + '（' + tt + ' 分鐘）。');
    advance(tt);
    if (S.t >= OUTBREAK) { S.loc = 'road'; checkOutbreak(); render(); return; }
    S.loc = dest;
    S.seenStores[dest] = true;
    if (!J.stores[dest]) { J.stores[dest] = true; saveJournal(); }
    if (dest === 'home') unload();
    if (!isOpen(dest, S.t)) log(STORES[dest].n + ' 已經關門了。', true);
    UI.tab = 'here';
    checkOutbreak();
    render();
    window.scrollTo(0, 0);
  },
  sell(id) {
    const f = FURNITURE.find(x => x.id === id);
    if (!f || S.sold[id] || S.loc !== 'home') return;
    S.sold[id] = true; S.money += f.p;
    log('把' + f.n + '賣給阿姨，拿到 ' + money(f.p) + '。');
    advance(5); checkOutbreak(); render();
  },
  loan() {
    if (S.loan) return;
    S.loan = true; S.money += 500;
    log('用手機申請快速貸款，入帳 $500。反正明天之後也沒人來討了。');
    render();
  },
  buyCar() {
    if (S.car || S.money < 500 || S.loc !== 'cars' || !isOpen('cars', S.t)) return;
    S.car = true; S.money -= 500;
    log('買下舊小車。移動時間大約減半，後車廂多 80kg。', true);
    advance(10); checkOutbreak(); render();
  },
  sellCar() {
    if (!S.car || S.loc !== 'cars' || !isOpen('cars', S.t)) return;
    if (weightOf(S.carry) > BASE_BAG + J.upg.bag * 5) { log('車上還有東西，先回家卸貨再來賣車。'); render(); return; }
    S.car = false; S.money += 450;
    log('把車賣回車行，拿回 $450。');
    advance(10); checkOutbreak(); render();
  },
  wait() {
    if (S.loc !== 'home') return;
    log('你鎖上門，等待 18:00。');
    advance(OUTBREAK - S.t);
    checkOutbreak(); render();
  },
  menu() { commitRun(); S = null; UI = { tab: 'here', qty: {} }; render(); },
  upg(id) {
    const u = UPGRADES.find(x => x.id === id);
    const lv = J.upg[id];
    if (lv >= u.max || J.pp < u.cost) return;
    J.pp -= u.cost; J.upg[id] = lv + 1; saveJournal(); render();
  },
  dev() { J.dev = !J.dev; saveJournal(); render(); },
  devMoney() { if (S) { S.money += 1000; log('[開發] +$1000'); render(); } },
  devTime() { if (S) { S.t -= 60; log('[開發] 時間倒回 60 分鐘'); render(); } },
  devPP() { J.pp += 10; saveJournal(); render(); },
  devReset() { J = freshJournal(); saveJournal(); S = null; render(); }
};

function unload() {
  const w = weightOf(S.carry);
  if (w <= 0) return;
  for (const [k, q] of Object.entries(S.carry)) {
    if (k === 'matpack') {
      const pool = ['board', 'metal', 'glass', 'plastic'];
      const got = {};
      for (let i = 0; i < q * 3; i++) { const m = pool[Math.floor(Math.random() * pool.length)]; got[m] = (got[m] || 0) + 1; add(S.home, m, 1); }
      log('拆開材料包：' + Object.entries(got).map(([m, n]) => ITEMS[m].n + '×' + n).join('、') + '。');
    } else add(S.home, k, q);
  }
  S.carry = {};
  log('回到家，卸下 ' + kg(w) + ' 物資（10 分鐘）。');
  advance(10);
}

function checkOutbreak() {
  if (S.phase !== 'play' || S.t < OUTBREAK) return;
  if (S.loc !== 'home') {
    finishRun({ days: 0, cause: '爆發時你還在外面，沒能趕回家。', causeKey: 'outside', timeline: [{ d: '18:00', txt: '屍群湧上街頭，你被困在路上。', cls: 'bad' }], stats: null });
    return;
  }
  startSurvive();
}

function finishRun(res) {
  S.phase = 'end';
  S.result = res;
  res.pp = 1 + Math.floor(res.days / 10);
  res.committed = false;
}

/* ================= 爆發後模擬（估算能撐幾天） ================= */
function simulate(home) {
  const h = k => home[k] || 0;
  const tl = [];
  const push = (d, txt, cls) => tl.push({ d: '第 ' + d + ' 天', txt, cls: cls || '' });

  let def = 10 + h('door') * 60 + Math.min(h('window'), 2) * 30 + h('board') * 4 + h('metal') * 6 + h('glass') * 3;
  const defStart = def;
  let hp = 100;
  let water = h('water') * 3 + h('barrel') * 5;
  let medkit = h('medkit'), pills = h('pills');
  // 食物池（先吃會壞的、再吃一般的、米要能煮才吃）
  const pools = {
    veg: h('veg') * 2,
    quick: h('sausage') + h('noodle') + h('choco') * 0.5,
    rice: h('rice') * 8,
    shelf: h('biscuit') * 3 + h('can') * 1.5
  };
  const totalMeals = pools.veg + pools.quick + pools.rice + pools.shelf;
  let battery = h('battery') * 10, batCap = h('battery') * 10;
  let diesel = h('gen') > 0 ? h('diesel') * 6 : 0;
  const solarN = h('solar');
  const freezer = h('freezer') > 0, cook = h('microwave') > 0, ac = h('ac') > 0, lightbox = h('lightbox');
  const seeds = (h('tomato') + h('straw')) * 2;
  const lightPlants = Math.min(lightbox * 4, seeds);
  const potPlants = Math.min(h('pot'), seeds - lightPlants);
  const fertMul = h('fert') > 0 ? 1.5 : 1;
  const mush = h('mush');

  let cause = '', causeKey = '', last = '';
  let powerOutLogged = false, foodOutLogged = false, waterOutLogged = false, vegLost = false;
  let hordesSeen = 0, coldSeen = false, rainSeen = false;
  let day = 0;

  if (!cook && pools.rice > 0) push(0, '家裡沒有微波爐，' + h('rice') + ' 袋米沒辦法煮。', 'bad');
  if (h('diesel') > 0 && h('gen') === 0) push(0, '有柴油但沒有發電機，柴油用不上。', 'bad');

  for (day = 1; day <= 100; day++) {
    const cold = day >= COLD[0] && day <= COLD[1];
    const rain = RAIN.some(r => day >= r[0] && day <= r[1]);
    if (day === COLD[0]) { push(day, '寒潮來了，氣溫驟降（約持續到第 ' + COLD[1] + ' 天）。'); coldSeen = true; }
    if (RAIN.some(r => day === r[0])) { push(day, '連日陰雨，太陽能幾乎不發電。'); rainSeen = true; }

    // 電力
    let demand = (freezer ? 1 : 0) + (cook && pools.rice > 0 ? 0.5 : 0) + lightbox * 1 + (cold && ac ? 2 : 0);
    let supply = solarN * 1.5 * (rain ? 0.1 : cold ? 0.6 : 1);
    let powered = true;
    if (demand > 0 || supply > 0) {
      let net = supply - demand;
      if (net >= 0) battery = Math.min(batCap, battery + net);
      else {
        let need = -net;
        const fromBat = Math.min(battery, need); battery -= fromBat; need -= fromBat;
        const fromDiesel = Math.min(diesel, need); diesel -= fromDiesel; need -= fromDiesel;
        if (need > 1e-6) powered = false;
      }
    }
    if (demand > 0 && !powered && !powerOutLogged) { powerOutLogged = true; push(day, (day === 1 && solarN === 0 && h('battery') === 0 && diesel === 0 ? '爆發後市電斷了，家裡沒有發電設備：' : '電力用完了：') + '冰櫃、微波爐、種植箱、冷氣都停擺。', 'bad'); }

    // 蔬菜保存
    if (pools.veg > 0 && !vegLost && ((!freezer && day > 5) || (freezer && !powered))) {
      push(day, '剩下的新鮮蔬菜壞掉了（' + pools.veg + ' 餐）。', 'bad'); pools.veg = 0; vegLost = true;
    }

    // 種植產出
    let farmMeals = 0;
    if (day >= 10) farmMeals += potPlants * 0.12 * fertMul + (powered ? lightPlants * 0.3 * fertMul : 0);
    if (day >= 6 && day < 46) farmMeals += mush * 0.25;
    if (day === 10 && (potPlants + lightPlants) > 0) push(day, '第一批作物收成了。', 'good');

    // 吃飯：每天 2 餐
    let need = 2 - Math.min(2, farmMeals);
    for (const key of ['veg', 'quick', 'rice', 'shelf']) {
      if (need <= 0) break;
      if (key === 'rice' && !(cook && powered)) continue;
      const take = Math.min(pools[key], need); pools[key] -= take; need -= take;
    }
    if (need > 0.01) {
      if (!foodOutLogged) { foodOutLogged = true; push(day, (pools.rice > 0 ? '能吃的食物吃完了（米沒辦法煮），' : '食物吃完了，') + '開始挨餓。', 'bad'); }
      hp -= need * 8; last = 'food';
    }
    // 喝水
    water += h('rain') * (rain ? 2 : 0.25);
    if (water >= 1) water -= 1;
    else { if (!waterOutLogged) { waterOutLogged = true; push(day, '水喝完了。', 'bad'); } hp -= 34; last = 'water'; }
    // 寒潮
    if (cold && !(ac && powered)) { hp -= 6; if (last !== 'water' && last !== 'food') last = 'cold'; }

    // 屍潮
    const hz = HORDES.find(x => x[0] === day);
    if (hz) {
      hordesSeen++;
      const str = hz[1];
      if (def >= str) push(day, '屍潮來襲（強度 ' + str + '），防禦 ' + Math.round(def) + ' 擋下了。', 'good');
      else { const dmg = (str - def) * 0.8; hp -= dmg; last = 'horde'; push(day, '屍潮來襲（強度 ' + str + '），防禦只有 ' + Math.round(def) + '，被突破，受傷 ' + Math.round(dmg) + '。', 'bad'); }
      def = Math.max(0, def - str * 0.12);
    }

    // 治療與自然回復
    if (hp > 0) {
      while (hp < 60 && medkit > 0) { medkit--; hp += 35; }
      while (hp < 75 && pills > 0) { pills--; hp += 10; }
      if (need <= 0.01 && water >= 0 && !waterOutLogged) hp = Math.min(100, hp + 2);
      hp = Math.min(100, hp);
    }
    if (hp <= 0) break;
  }

  const days = Math.min(100, day > 100 ? 100 : day - 1);
  if (day > 100) { cause = '你撐過了 100 天。'; push(100, '撐過 100 天！', 'good'); }
  else {
    const map = { water: ['缺水，撐不下去了。', 'water'], food: ['斷糧，餓到撐不下去。', 'food'], horde: ['屍群破門而入。', 'horde'], cold: ['在寒潮中失溫。', 'cold'] };
    const m = map[last] || ['撐不下去了。', 'other'];
    cause = m[0]; causeKey = m[1];
    push(day, cause, 'bad');
  }
  return {
    days, cause, causeKey, timeline: tl, hordesSeen, coldSeen, rainSeen,
    stats: { meals: totalMeals, cookable: cook, waterDays: h('water') * 3 + h('barrel') * 5, def: defStart, power: (h('gen') ? h('diesel') * 6 : 0) + h('battery') * 10, solar: solarN }
  };
}

/* ================= 畫面 ================= */
function render() {
  if (!S) { $app.innerHTML = viewTitle(); return; }
  if (S.phase === 'survive') { renderSurvive(); return; }
  if (S.phase === 'end') { $app.innerHTML = viewEnd(); return; }
  const left = OUTBREAK - S.t;
  const cap = capacity(), w = carried();
  const store = STORES[S.loc];
  let body = '';
  if (UI.tab === 'here') body = viewHere();
  else if (UI.tab === 'map') body = viewMap();
  else if (UI.tab === 'inv') body = viewInv();
  else body = viewJournal(false);
  $app.innerHTML =
    '<header class="status"><div class="status-in">' +
      '<div class="stamp' + (left <= 60 ? ' urgent' : '') + '"><div class="lbl">距離爆發</div><div class="big">' + dur(left) + '</div></div>' +
      '<div class="meters">' +
        '<div class="row"><span><span class="k">時間</span> <b class="num">' + clock(S.t) + '</b></span><span><span class="k">現金</span> <b class="num">' + money(S.money) + '</b></span></div>' +
        '<div class="row"><span class="k">' + (S.car ? '背包＋車廂' : '背包') + '</span><span class="num">' + kg(w) + ' / ' + cap + 'kg</span></div>' +
        '<div class="bar' + (w >= cap - 0.01 ? ' full' : '') + '"><i style="width:' + Math.min(100, w / cap * 100) + '%"></i></div>' +
      '</div></div></header>' +
    '<main class="wrap">' +
      '<div class="ticker">' + S.log.slice(0, 3).map(l => '<p class="' + (l.alert ? 'alert' : '') + '">' + esc(l.txt) + '</p>').join('') + '</div>' +
      '<div class="place"><h2>' + esc(store.n) + '</h2><span class="sub">' + (store.closes ? (isOpen(S.loc, S.t) ? '營業到 ' + clock(store.closes) : '已關門') : '') + '</span></div>' +
      body +
    '</main>' +
    '<nav class="tabs" role="tablist">' +
      tabBtn('here', '這裡') + tabBtn('map', '地圖') + tabBtn('inv', '物資') + tabBtn('journal', '日誌') +
    '</nav>';
}
function tabBtn(id, label) { return '<button role="tab" aria-selected="' + (UI.tab === id) + '" data-a="tab" data-v="' + id + '">' + label + '</button>'; }

function viewHere() {
  const id = S.loc, st = STORES[id];
  let h = '<p class="sub" style="margin:0 0 10px;color:var(--muted)">' + esc(st.desc) + '</p>';
  if (id === 'home') {
    h += '<div class="cat">收舊家具的阿姨</div><div class="sheet">' +
      FURNITURE.map(f => '<div class="item"><div><div class="nm">' + f.n + '</div><div class="meta">賣掉要 5 分鐘</div></div>' +
        '<div class="price">' + money(f.p) + '</div><div class="ctrl"><button class="btn ghost" data-a="sell" data-v="' + f.id + '"' + (S.sold[f.id] ? ' disabled' : '') + '>' + (S.sold[f.id] ? '已賣出' : '賣掉') + '</button></div></div>').join('') +
      '</div>';
    h += '<div class="cat">手機</div><div class="sheet"><div class="item"><div><div class="nm">快速貸款</div><div class="meta">一次 $500，不花時間</div></div><div class="price">+$500</div>' +
      '<div class="ctrl"><button class="btn ghost" data-a="loan"' + (S.loan ? ' disabled' : '') + '>' + (S.loan ? '已借' : '借錢') + '</button></div></div></div>';
    h += '<div class="row-btns"><button class="btn red" data-a="wait">鎖門，直接等到 18:00</button></div>';
    return h;
  }
  if (id === 'cars') {
    const open = isOpen('cars', S.t);
    h += '<div class="sheet"><div class="item"><div><div class="nm">二手小車</div><div class="meta">移動時間約減半 · 後車廂 +80kg · 買賣各花 10 分鐘</div></div><div class="price">' + (S.car ? '+$450' : '$500') + '</div><div class="ctrl">' +
      (S.car ? '<button class="btn ghost" data-a="sellCar"' + (open ? '' : ' disabled') + '>賣回車行</button>'
             : '<button class="btn" data-a="buyCar"' + (open && S.money >= 500 ? '' : ' disabled') + '>買下</button>') +
      '</div></div></div>';
    return h;
  }
  const open = isOpen(id, S.t);
  if (!open) return h + '<p class="empty">已經關門了。去別的地方吧。</p>';
  const items = Object.keys(st.items);
  for (const cat of CAT_ORDER) {
    const ks = items.filter(k => ITEMS[k].cat === cat);
    if (!ks.length) continue;
    h += '<div class="cat">' + CAT_NAMES[cat] + '</div><div class="sheet">';
    for (const k of ks) {
      const it = ITEMS[k], p = price(id, k), base = st.items[k][0], stock = S.stock[id][k];
      const q = UI.qty[k] || 1;
      const blocked = stock <= 0 || (it.cat === 'equip' && !deliveryOk());
      const pcls = p === 0 ? 'free' : p > base ? 'up' : '';
      h += '<div class="item"><div><div class="nm">' + it.n +
        (stock <= 0 ? '<span class="tag red">售完</span>' : '') +
        (it.cat === 'equip' && !deliveryOk() ? '<span class="tag red">送不到</span>' : '') +
        '</div><div class="meta">' + it.note + (it.w ? ' · ' + kg(it.w) : '') + ' · 剩 ' + stock + '</div></div>' +
        '<div class="price ' + pcls + '">' + (p === 0 ? '免費' : money(p)) + '</div>' +
        '<div class="ctrl"><span class="step"><button data-a="qty" data-v="' + k + ':-1" aria-label="減少">−</button><input class="qty-in" type="number" inputmode="numeric" min="1" max="99" id="qty-' + k + '" data-qty="' + k + '" value="' + q + '" aria-label="' + it.n + ' 數量"><button data-a="qty" data-v="' + k + ':1" aria-label="增加">＋</button></span>' +

}

function viewMap() {

  for (const p of pts) {

    svg += '<g><circle cx="' + p.x + '" cy="' + p.y + '" r="' + (here ? 11 : 8) + '" fill="' + (here ? '#b8322a' : closed ? '#c6c1b2' : '#1d2733') + '"/>' +
      '<text x="' + p.x + '" y="' + (['conv', 'pharm', 'mart', 'farm'].includes(p.id) ? p.y + 32 : p.y - 18) + '" text-anchor="middle" font-size="21" font-family="LXGW WenKai TC, serif" fill="#1d2733">' + STORES[p.id].n + '</text></g>';
  }

  const dests = STORE_ORDER.filter(id => id !== S.loc).map(id => ({ id, tt: travelTime(S.loc, id) })).sort((a, b) => a.tt - b.tt);
  for (const d of dests) {
    const arrive = S.t + d.tt, st = STORES[d.id];
    const late = arrive >= OUTBREAK;

    const closed = st.closes && arrive >= st.closes;
    let meta = d.tt + ' 分鐘 · ' + clock(arrive) + ' 抵達';

    const known = J.stores[d.id] && st.items ? '<div class="meta">日誌：' + Object.keys(st.items).map(k => ITEMS[k].n).join('、') + '</div>' : '';
    h += '<div class="dest"><div><b>' + st.n + '</b><div class="meta">' + meta + '</div>' + known + '</div>' +

  h += '</div>';

    def: 10 + g('door') * 60 + Math.min(g('window'), 2) * 30 + g('board') * 4 + g('metal') * 6 + g('glass') * 3,

/* ================= M2：爆發後守家生存 ================= */
const FOOD = {
  rice_c: { sat: 25, dish: true }, biscuit: { sat: 75 }, sausage: { sat: 25 }, noodle: { sat: 25 }, can: { sat: 38 },
  veg: { sat: 50, mor: 3 }, choco: { sat: 12, mor: 10 }, tomato_p: { sat: 15, mor: 3 }, straw_p: { sat: 15, mor: 6 }, mushroom: { sat: 20 },
  soup: { sat: 40, mor: 5, dish: true }, hotpot: { sat: 100, mor: 12, dish: true }, juice: { sat: 10, mor: 8 }
};
const FRESH_LIFE = { veg: 5, rice_c: 2, tomato_p: 3, straw_p: 3, mushroom: 3, soup: 2, hotpot: 1 };
const REINFORCE = { board: 40, metal: 70, glass: 20 };
const LAST_HOUR = 24;
const inCold = d => d >= COLD[0] && d <= COLD[1];
const inRain = d => RAIN.some(r => d >= r[0] && d <= r[1]);
const hordeOn = d => d > 100 ? ((d - 100) % 7 === 0 ? [d, 320 + (d - 100) / 7 * 40] : undefined) : HORDES.find(x => x[0] === d);
function hordeSize(str) { return str < 60 ? '小規模' : str < 150 ? '中規模' : '大規模'; }

function startSurvive() {
  const st = {};
  for (const [k, q] of Object.entries(S.home)) st[k] = q;
  st.wu = (st.water || 0) * 6 + (st.barrel || 0) * 10;
  delete st.water;
  const fresh = [];
  if (st.veg) { fresh.push({ k: 'veg', q: st.veg, life: FRESH_LIFE.veg }); delete st.veg; }
  const defMax = 120 + (st.door || 0) * 480 + Math.min(st.window || 0, 2) * 120;
  S.phase = 'survive';
  S.sv = {
    day: 1, hour: 18, hp: 100, sat: 70, hyd: 70, sta: 70, mor: 60,
    power: Math.min(3 + (st.battery || 0) * 10, (st.battery || 0) * 10),
    def: defMax, defMax, st, fresh,
    dev: { freezer: true, lightbox: true, ac: false },
    plants: [], farmAcc: 0, mushAcc: 0,
    log: [], chron: [], lastHurt: '', hordesSeen: 0, coldSeen: false, rainSeen: false, rainAcc: 0
  };
  UI = { tab: 'act', qty: {} };
  slog('18:00，尖叫聲從街上傳來。你鎖上門，這裡就是你的堡壘了。', true);
  chron(0, '爆發。防線耐久 ' + defMax + '，水 ' + st.wu + ' 份。');
  if (hordeOn(1)) slog('收音機：今晚有屍潮。', true);
  m4Init(S.sv);
  m5Init(S.sv);
  m6Init(S.sv);
  S.snaps = [];
  snapshot();
}

function slog(txt, alert) { const sv = S.sv; sv.log.unshift({ txt, alert: !!alert }); sv.log = sv.log.slice(0, 30); }
function chron(d, txt, cls) { S.sv.chron.push({ d: d ? '第 ' + d + ' 天' : '爆發', txt, cls: cls || '' }); }
function sv_has(k) { const sv = S.sv; return (sv.st[k] || 0) + sv.fresh.filter(f => f.k === k).reduce((a, f) => a + f.q, 0); }
function sv_take(k, n) {
  const sv = S.sv;
  const batches = sv.fresh.filter(f => f.k === k).sort((a, b) => a.life - b.life);
  for (const b of batches) { const t = Math.min(b.q, n); b.q -= t; n -= t; if (n <= 0) break; }
  sv.fresh = sv.fresh.filter(f => f.q > 0);
  if (n > 0) { sv.st[k] = (sv.st[k] || 0) - n; if (sv.st[k] <= 0) delete sv.st[k]; }
}
function sv_addFresh(k, q) { if (q > 0) S.sv.fresh.push({ k, q, life: FRESH_LIFE[k] }); }
const clamp = v => Math.max(0, Math.min(100, v));
function powerCap() { return 3 + (S.sv.st.battery || 0) * 10; }
function slots() { const st = S.sv.st; return { light: (st.lightbox || 0) * 4, green: (S.sv.rooms || []).filter(r => r === 'greenhouse').length * 4, pot: st.pot || 0 }; }
function heated() { const sv = S.sv; return (sv.dev.ac && (sv.st.ac || 0) > 0 && sv.power > 0) || ((sv.st.heater || 0) > 0 && (sv.st.board || 0) > 0); }

function hurt(v, why) { const sv = S.sv; sv.hp -= v; if (v > 0) sv.lastHurt = why; }

// 醒著的時間流逝
function passHours(n) {
  const sv = S.sv;
  for (let i = 0; i < n; i++) {
    sv.hour++;
    sv.sat = clamp(sv.sat - 2.2);
    sv.hyd = clamp(sv.hyd - 3);
    sv.mor = clamp(sv.mor - 0.3);
    if (sv.sat <= 0) hurt(2, 'food');
    if (sv.hyd <= 0) hurt(4, 'water');
    if (inCold(sv.day) && !heated()) hurt(hasT('warm') ? 0.5 : 1, 'cold');
  }
  checkDeath();
}

function checkDeath() {
  const sv = S.sv;
  if (sv.hp > 0 || S.phase !== 'survive') return false;
  const map = { water: ['缺水，撐不下去了。', 'water'], food: ['斷糧，餓到撐不下去。', 'food'], horde: ['屍群破門而入。', 'horde'], cold: ['在寒潮中失溫。', 'cold'], ambush: ['外出時被屍群包圍，沒能逃回家。', 'ambush'] };
  const m = map[sv.lastHurt] || ['撐不下去了。', 'other'];
  chron(sv.day, m[0], 'bad');
  finishRun({ days: sv.day - 1, cause: m[0], causeKey: m[1], timeline: sv.chron, stats: null, hordesSeen: sv.hordesSeen, coldSeen: sv.coldSeen, rainSeen: sv.rainSeen });
  return true;
}

function canAct(hours, sta) {
  const sv = S.sv;
  if (S.phase !== 'survive') return false;
  if (sv.hour + hours > LAST_HOUR) return false;
  if (sta && sv.sta < sta) return false;
  return true;
}

const SACT = {
  eat(k) {
    const sv = S.sv, f = FOOD[k];
    if (!f || sv_has(k) <= 0) return;
    sv_take(k, 1);
    const gain = Math.round(f.sat * (f.dish && hasT('chef') ? 1.2 : 1));
    sv.sat = clamp(sv.sat + gain); if (f.mor) sv.mor = clamp(sv.mor + f.mor);
    slog('吃了' + ITEMS[k].n + '，飽足 +' + gain + '。');
    render();
  },
  drink() {
    const sv = S.sv;
    if (sv.st.wu < 1) return;
    sv.st.wu -= 1; sv.hyd = clamp(sv.hyd + 30);
    slog('喝了一份水，水分 +30。'); render();
  },
  cook() {
    const sv = S.sv;
    if (!canAct(1, 5) || !(sv.st.microwave > 0) || !(sv.st.rice > 0) || sv.power < 0.3) return;
    sv.st.rice -= 1; if (!sv.st.rice) delete sv.st.rice;
    sv.power -= 0.3; sv.sta -= 5; sv_addFresh('rice_c', 8);
    slog('用微波爐煮了一袋米，得到 8 份熟飯（2 天內要吃完）。');
    passHours(1); render();
  },
  reinforce(k) {
    const sv = S.sv;
    if (sv.sick) { slog('生病中，沒力氣加固。'); render(); return; }
    if (!canAct(1, staCost(12)) || !(sv.st[k] > 0) || sv.def >= sv.defMax * 1.5) return;
    sv.st[k] -= 1; if (!sv.st[k]) delete sv.st[k];
    const add = REINFORCE[k];
    sv.def = Math.min(sv.defMax * 1.5, sv.def + add); sv.sta -= staCost(12);
    slog('用' + ITEMS[k].n + '加固防線，耐久 +' + add + '。');
    passHours(1); render();
  },
  gen() {
    const sv = S.sv;
    if (!canAct(1) || !(sv.st.gen > 0) || !(sv.st.diesel > 0)) return;
    const cap = powerCap();
    if (sv.power >= cap) { slog('電已經存滿了。'); render(); return; }
    sv.st.diesel -= 1; if (!sv.st.diesel) delete sv.st.diesel;
    const before = sv.power; sv.power = Math.min(cap, sv.power + 6 * powerMul());
    slog('發電機轟轟作響，燒掉一桶柴油，電力 +' + (Math.round((sv.power - before) * 10) / 10) + ' 度' + (sv.power - before < 6 * powerMul() - 0.01 ? '（存不下的浪費了）' : '') + '。');
    passHours(1); render();
  },
  pedal() {
    const sv = S.sv;
    if (!canAct(1, staCost(20)) || !(sv.st.pedal > 0)) return;
    sv.sta -= staCost(20); sv.power = Math.min(powerCap(), sv.power + 1.5 * powerMul());
    slog('踩了一小時人力發電機，電力 +1.5 度。');
    passHours(1); render();
  },
  plant(k) {
    const sv = S.sv;
    if (!canAct(1, 5) || !(sv.st[k] > 0)) return;
    const s = slots();
    const free = freeSlots();
    if (free <= 0) { slog('沒有空的盆位了。'); render(); return; }
    sv.st[k] -= 1; if (!sv.st[k]) delete sv.st[k];
    const n = Math.min(2, free);
    for (let i = 0; i < n; i++) {
      const cnt = t => sv.plants.filter(p => p.slot === t).length;
      const slot = cnt('light') < s.light ? 'light' : cnt('green') < s.green ? 'green' : 'pot';
      sv.plants.push({ k: k === 'tomato' ? 'tomato_p' : 'straw_p', slot, age: 0 });
    }
    sv.sta -= 5;
    slog('種下' + ITEMS[k].n + '，' + n + ' 株。大約 8 天後開始收成。');
    passHours(1); render();
  },
  rest() {
    const sv = S.sv;
    if (!canAct(1)) return;
    sv.mor = clamp(sv.mor + 12); sv.sta = clamp(sv.sta + 5);
    slog('翻了翻舊漫畫，聽了一會兒收音機。心態 +12。');
    passHours(1); render();
  },
  heal(k) {
    const sv = S.sv;
    if (!(sv.st[k] > 0) || (sv.hp >= 100 && !(k === 'pills' && sv.sick))) return;
    sv.st[k] -= 1; if (!sv.st[k]) delete sv.st[k];
    const v = k === 'medkit' ? 35 : 10;
    sv.hp = Math.min(100, sv.hp + v); if (k === 'pills') { sv.mor = clamp(sv.mor + 3); if (sv.sick) { sv.sick = 0; slog('病好了。'); } }
    slog('用了' + ITEMS[k].n + '，生命 +' + v + '。'); render();
  },
  toggle(k) { const sv = S.sv; sv.dev[k] = !sv.dev[k]; slog((sv.dev[k] ? '打開' : '關掉') + ITEMS[k].n + '（睡前結算耗電）。'); render(); },
  sleep() { night(false); },
  watch() { night(true); },
  giveup() { const sv = S.sv; sv.lastHurt = 'other'; chron(sv.day, '你放棄了這一輪。', 'bad'); finishRun({ days: sv.day - 1, cause: '你放棄了這一輪。', causeKey: '', timeline: sv.chron, stats: null, hordesSeen: sv.hordesSeen, coldSeen: sv.coldSeen, rainSeen: sv.rainSeen }); render(); }
};

function night(watch) {
  const sv = S.sv, d = sv.day, st = sv.st;
  if (S.phase !== 'survive') return;
  const cold = inCold(d), rain = inRain(d);
  const cap = powerCap();

  // 1. 白天太陽能入帳
  const solar = (st.solar || 0) * 1.5 * powerMul() * (rain ? 0.1 : cold ? 0.6 : 1);
  if (solar > 0) sv.power = Math.min(cap, sv.power + solar);

  // 2. 設備耗電（冷氣 > 冰櫃 > 種植箱）
  const devs = [['ac', cold ? 2 : 0], ['freezer', 1], ['lightbox', (st.lightbox || 0) * 1]];
  sv.powered = {};
  for (const [k, need] of devs) {
    if (!(st[k] > 0) || !sv.dev[k] || need <= 0) { sv.powered[k] = false; continue; }
    if (sv.power >= need) { sv.power -= need; sv.powered[k] = true; }
    else { sv.powered[k] = false; slog('電不夠，' + ITEMS[k].n + '停了。', true); }
  }
  sv.acOn = !!sv.powered.ac;
  sv.heaterOn = false;
  if (cold && !sv.acOn && (st.heater || 0) > 0 && (st.board || 0) > 0) { st.board--; if (!st.board) delete st.board; sv.heaterOn = true; slog('暖爐燒掉 1 片木板。'); }
  const warmNight = sv.acOn || sv.heaterOn;

  // 3. 雨水
  if (st.rain) { sv.rainAcc += st.rain * (rain ? 2 : 0.25); const w = Math.floor(sv.rainAcc); if (w > 0) { st.wu += w; sv.rainAcc -= w; slog('雨水收集器裝了 ' + w + ' 份水。'); } }

  // 4. 屍潮
  const hz = hordeOn(d);
  if (hz) {
    sv.hordesSeen++;
    let dmg = hz[1] * 4 * (watch ? 0.6 : 1);
    let trapKill = 0;
    for (const t of sv.traps) {
      const T = TRAPS[t.k];
      if (T.power) { if (sv.power >= T.power) sv.power -= T.power; else { slog(T.n + '沒電，沒有啟動。', true); continue; } }
      trapKill += T.dmg * (hasT('traps') ? 1.15 : 1) * (1 + (defLv() - 1) * 0.05); t.uses--;
    }
    sv.traps = sv.traps.filter(t => t.uses > 0);
    let molo = 0;
    if (watch) while (molo < 3 && (st.molotov || 0) > 0) { st.molotov--; if (!st.molotov) delete st.molotov; trapKill += 120; molo++; }
    if (molo) slog('你從窗口丟出 ' + molo + ' 瓶燃燒瓶。');
    if (trapKill) dmg = Math.max(0, dmg - trapKill);
    const dlBefore = defLv();
    sv.defXp = (sv.defXp || 0) + hz[1] / 10;
    if (defLv() > dlBefore) slog('防禦等級升到 ' + defLv() + ' 級！' + (defLv() === 2 ? '可以做電擊陷阱了。' : defLv() === 4 ? '可以做電鋸陷阱了。' : ''), true);
    let used = 0;
    if (watch) {
      for (const m of ['metal', 'board', 'glass']) {
        while (used < 3 && st[m] > 0 && dmg > sv.def * 0.5) { st[m]--; if (!st[m]) delete st[m]; sv.def += REINFORCE[m]; used++; }
      }
    }
    sv.def -= dmg;
    if (sv.def >= 0) {
      sv.sp += 10;
      chron(d, '屍潮（強度 ' + hz[1] + '）' + (trapKill ? '，陷阱擋下 ' + Math.round(trapKill) : '') + (watch ? '，你守了一夜' + (used ? '、邊打邊修用掉 ' + used + ' 份材料' : '') : '') + '。防線剩 ' + Math.round(sv.def) + '。', 'good');
      slog('屍潮退去了，防線剩 ' + Math.round(sv.def) + '。', true);
    } else {
      const over = -sv.def; sv.def = 0;
      const h = Math.round((over * 0.25 + 15) * (hasT('tough') ? 0.7 : 1));
      hurt(h, 'horde'); sv.mor = clamp(sv.mor - 20);
      chron(d, '屍潮（強度 ' + hz[1] + '）突破防線，你受傷 ' + h + '。', 'bad');
      slog('防線被突破了！生命 -' + h + '。', true);
    }
  }

  // 5. 睡眠
  const hoursLeft = Math.max(0, LAST_HOUR - sv.hour);
  for (let i = 0; i < hoursLeft; i++) {
    sv.sat = clamp(sv.sat - 1.1); sv.hyd = clamp(sv.hyd - 1.5);
    if (sv.sat <= 0) hurt(1, 'food');
    if (sv.hyd <= 0) hurt(2, 'water');
    if (cold && !warmNight) hurt(hasT('warm') ? 0.25 : 0.5, 'cold');
  }
  sv.sat = clamp(sv.sat - 10);
  sv.hyd = clamp(sv.hyd - 14);
  if (watch) sv.sta = clamp(sv.sta + 15);
  else sv.sta = clamp(sv.sta + (55 + (roomN('bedroom') ? 10 : 0) + (sv.mor > 50 ? 15 : 0) - (sv.mor < 20 ? 20 : 0)) * (sv.sick ? 0.5 : 1));
  if (sv.sat <= 0) hurt(10, 'food');
  if (sv.hyd <= 0) hurt(20, 'water');
  if (cold && !warmNight) hurt(hasT('warm') ? 4 : 8, 'cold');
  if (sv.sat > 30 && sv.hyd > 30 && !hz) sv.hp = Math.min(100, sv.hp + 5);
  if (checkDeath()) { render(); return; }

  // 6. 新的一天
  sv.day++; sv.hour = 8;
  const nd = sv.day;
  sv.mor = clamp(sv.mor - 4 + (roomN('bedroom') ? 3 : 0));
  sv.sp += 1;
  if (sv.sick > 0) { sv.sick--; if (!sv.sick) slog('病好了。'); }

  // 腐壞
  const frozen = sv.powered.freezer;
  for (const f of sv.fresh) f.life -= frozen ? 0.2 : 1;
  const spoiled = sv.fresh.filter(f => f.life <= 0);
  if (spoiled.length) slog(spoiled.map(f => ITEMS[f.k].n + '×' + f.q).join('、') + ' 壞掉了。', true);
  sv.fresh = sv.fresh.filter(f => f.life > 0);

  // 作物
  const fert = (st.fert || 0) > 0 ? 1.5 : 1;
  const harvest = {};
  for (const p of sv.plants) {
    p.age++;
    if (p.age < 8) continue;
    if (p.slot === 'light' && !sv.powered.lightbox) continue;
    const rate = (p.slot === 'pot' ? 0.5 : 1) * (hasT('green') ? 1.3 : 1);
    p.acc = (p.acc || 0) + rate * fert;
    const got = Math.floor(p.acc); p.acc -= got;
    if (got) harvest[p.k] = (harvest[p.k] || 0) + got;
  }
  if (st.mush && nd >= 6 && nd < 46) { sv.mushAcc += st.mush * 0.5; const g = Math.floor(sv.mushAcc); if (g) { harvest.mushroom = (harvest.mushroom || 0) + g; sv.mushAcc -= g; } }
  const hv = Object.entries(harvest);
  if (hv.length) { for (const [k, q] of hv) sv_addFresh(k, q); slog('收成：' + hv.map(([k, q]) => ITEMS[k].n + '×' + q).join('、') + '。'); }

  // 天氣與廣播
  if (nd === COLD[0]) { sv.coldSeen = true; chron(nd, '寒潮來了，沒取暖會一直掉血。'); slog('寒潮來了！氣溫驟降。' + (st.ac ? '到「據點」把冷氣打開取暖。' : ''), true); }
  if (nd === COLD[1] + 1) chron(nd, '寒潮過去了。', 'good');
  if (RAIN.some(r => nd === r[0])) { sv.rainSeen = true; chron(nd, '連日陰雨，太陽能幾乎不發電。'); slog('外面下起連綿大雨。', true); }
  const tonight = hordeOn(nd), tomorrow = hordeOn(nd + 1);
  if (tonight) slog('收音機：今晚有' + hordeSize(tonight[1]) + '屍潮（強度 ' + tonight[1] + '）。', true);
  else if (tomorrow) slog('收音機：明晚會有' + hordeSize(tomorrow[1]) + '屍潮。');
  morningDisaster(nd);
  m5Morning(nd);
  slog('第 ' + nd + ' 天早上。');
  if (nd <= 100) snapshot();

  if (nd > 100 && !sv.endless) {
    const e = pickEnding(sv);
    chron(100, '結局「' + ENDINGS[e].n + '」：' + ENDINGS[e].d, 'good');
    J.endings[e] = true; saveJournal();
    finishRun({ days: 100, cause: '你撐過了 100 天。', causeKey: '', timeline: sv.chron, stats: null, hordesSeen: sv.hordesSeen, coldSeen: sv.coldSeen, rainSeen: sv.rainSeen, ending: e, canEndless: true });
  }
  UI.tab = 'act';
  render();
  window.scrollTo(0, 0);
}

/* ---------- M2 畫面 ---------- */
function meter(label, v, warn) {
  return '<div class="m"><span class="k">' + label + '</span><div class="bar' + (v <= warn ? ' full' : '') + '"><i style="width:' + clamp(v) + '%"></i></div><span class="num">' + Math.round(v) + '</span></div>';
}
function renderSurvive() {
  const sv = S.sv;
  const tonight = hordeOn(sv.day);
  let body = UI.tab === 'base' ? viewBase() : UI.tab === 'store' ? viewStore() : UI.tab === 'journal' ? viewJournal(false) : viewActs();
  $app.innerHTML =
    '<header class="status"><div class="status-in">' +
      '<div class="stamp' + (tonight ? ' urgent' : '') + '"><div class="lbl">' + (tonight ? '今晚屍潮' : '倖存') + '</div><div class="big">第' + sv.day + '天</div><div class="lbl num">' + String(sv.hour).padStart(2, '0') + ':00</div></div>' +
      '<div class="meters sv">' + meter('生命', sv.hp, 30) + meter('飽足', sv.sat, 20) + meter('水分', sv.hyd, 20) + meter('體力', sv.sta, 15) + meter('心態', sv.mor, 20) + '</div>' +
    '</div></header>' +
    '<main class="wrap">' +
      '<div class="ticker">' + sv.log.slice(0, 3).map(l => '<p class="' + (l.alert ? 'alert' : '') + '">' + esc(l.txt) + '</p>').join('') + '</div>' +
      '<div class="chips"><span>防線 <b class="num">' + Math.round(sv.def) + '</b>/' + sv.defMax + '</span><span>電 <b class="num">' + (Math.round(sv.power * 10) / 10) + '</b>/' + powerCap() + ' 度</span><span>水 <b class="num">' + sv.st.wu + '</b> 份</span>' +
        (inCold(sv.day) ? '<span class="tag red">寒潮</span>' : '') + (inRain(sv.day) ? '<span class="tag amber">陰雨</span>' : '') + '</div>' +
      body +
    '</main>' +
    '<nav class="tabs" role="tablist">' + tabBtn('act', '行動') + tabBtn('base', '據點') + tabBtn('store', '倉庫') + tabBtn('journal', '日誌') + '</nav>';
}

function actRow(name, meta, btn, act, v, ok) {
  return '<div class="item"><div><div class="nm">' + name + '</div><div class="meta">' + meta + '</div></div>' +
    '<button class="btn" data-a="' + act + '"' + (v ? ' data-v="' + v + '"' : '') + (ok ? '' : ' disabled') + '>' + btn + '</button></div>';
}
function viewActs() {
  const sv = S.sv, st = sv.st;
  if (sv.out) return viewOut();
  const late = sv.hour >= LAST_HOUR;
  let h = sv.sick ? '<p class="alert-line">生病中（剩 ' + sv.sick + ' 天）：體力回得慢、不能加固。止痛藥可以治好。</p>' : '';
  if (!st.microwave && st.rice) h += '<p class="empty">米要用微波爐煮，你家沒有。</p>';
  // 吃喝
  const foods = Object.keys(FOOD).filter(k => sv_has(k) > 0);
  h += '<div class="cat">吃喝（不花時間）</div><div class="sheet">';
  h += actRow('喝水', '水分 +30 · 剩 ' + st.wu + ' 份', '喝', 'drink', '', st.wu >= 1 && sv.hyd < 100);
  if (!foods.length) h += '<p class="empty">沒有能直接吃的東西了' + (st.rice ? '（米要先煮）' : '') + '。</p>';
  for (const k of foods) {
    const fr = sv.fresh.filter(f => f.k === k);
    const life = fr.length ? Math.min(...fr.map(f => f.life)) : null;
    h += actRow(ITEMS[k].n + ' ×' + sv_has(k), '飽足 +' + FOOD[k].sat + (FOOD[k].mor ? ' · 心態 +' + FOOD[k].mor : '') + (life !== null ? ' · 最快 ' + Math.ceil(life) + ' 天後壞' : ''), '吃', 'eat', k, sv.sat < 100);
  }
  h += '</div>';
  // 工作
  h += '<div class="cat">做事（每項 1 小時）</div><div class="sheet">';
  for (const m of ['metal', 'board', 'glass']) if (st[m]) h += actRow('用' + ITEMS[m].n + '加固', '防線 +' + REINFORCE[m] + ' · 剩 ' + st[m] + ' · 體力 -' + staCost(12) + ' · 上限 ' + Math.round(sv.defMax * 1.5), '加固', 'reinforce', m, !sv.sick && canAct(1, staCost(12)) && sv.def < sv.defMax * 1.5);
  if (st.gen) h += actRow('開發電機', '燒 1 桶柴油 → 電 +6 · 剩 ' + (st.diesel || 0) + ' 桶', '發電', 'gen', '', canAct(1) && st.diesel > 0);
  if (st.pedal) h += actRow('踩人力發電機', '電 +1.5 · 體力 -' + staCost(20), '踩', 'pedal', '', canAct(1, staCost(20)));
  for (const k of ['tomato', 'straw']) if (st[k]) h += actRow('種' + ITEMS[k].n, '一包種 2 株 · 盆位 ' + freeSlots() + ' 個空 · 體力 -5', '種', 'plant', k, canAct(1, 5) && freeSlots() > 0);
  h += actRow('休息、聽收音機', '心態 +12 · 體力 +5', '休息', 'rest', '', canAct(1));
  h += '</div>';
  h += viewOutside();
  h += viewCraft();
  if (st.medkit || st.pills) {
    h += '<div class="cat">治療</div><div class="sheet">';
    if (st.medkit) h += actRow('急救包 ×' + st.medkit, '生命 +35', '用', 'heal', 'medkit', sv.hp < 100);
    if (st.pills) h += actRow('止痛藥 ×' + st.pills, '生命 +10 · 心態 +3', '用', 'heal', 'pills', sv.hp < 100);
    h += '</div>';
  }
  // 睡覺
  const hz = hordeOn(sv.day);
  h += '<div class="cat">結束這一天</div><div class="sheet">';
  if (late) h += '<p class="empty">已經半夜了，只能睡覺。</p>';
  h += actRow('睡覺到明天 08:00', '體力大幅回復 · 睡前結算太陽能、設備耗電' + (hz ? ' · <b style="color:var(--stamp)">今晚屍潮（強度 ' + hz[1] + '）</b>' : ''), '睡覺', 'sleep', '', true);
  if (hz) h += actRow('守夜', '屍潮傷害 -40%，邊打邊用材料修（最多 3 份）· 體力只回 15', '守夜', 'watch', '', true);
  h += '</div>';
  h += '<div class="row-btns"><button class="btn ghost" data-a="giveup">放棄這一輪</button></div>';
  return h;
}
function freeSlots() { const s = slots(); return s.light + s.green + s.pot - S.sv.plants.length; }

function viewBase() {
  const sv = S.sv, st = sv.st;
  const cold = inCold(sv.day);
  let h = '<div class="cat">防線</div><div class="sheet"><div class="item"><div><div class="nm">耐久 ' + Math.round(sv.def) + ' / ' + sv.defMax + '</div><div class="meta">加固最多到 ' + Math.round(sv.defMax * 1.5) + '。屍潮傷害約為強度 ×4。防禦等級 ' + defLv() + '（經驗 ' + Math.round(sv.defXp || 0) + (defLv() < 4 ? '/' + DEF_LV[defLv()] : '') + '），每級陷阱傷害 +5%。</div></div><div></div>' +
    '<div class="ctrl" style="justify-content:stretch"><div class="bar" style="flex:1"><i style="width:' + Math.min(100, sv.def / (sv.defMax * 1.5) * 100) + '%"></i></div></div></div></div>';
  const next = HORDES.find(x => x[0] >= sv.day);
  if (next && J.hordesSeen > HORDES.indexOf(next)) h += '<p class="empty">日誌：下一波屍潮在第 ' + next[0] + ' 天，強度 ' + next[1] + '。</p>';
  h += viewTraps();
  h += '<div class="cat">電力與設備</div><div class="sheet">';
  h += '<div class="item"><div><div class="nm">存電 ' + (Math.round(sv.power * 10) / 10) + ' / ' + powerCap() + ' 度</div><div class="meta">太陽能板 ' + (st.solar || 0) + ' 片（晴天每片 1.5 度/天）· 儲電站 ' + (st.battery || 0) + ' 台</div></div><div></div></div>';
  const devs = [['freezer', '1 度/天 · 新鮮食物壞得慢 5 倍'], ['lightbox', ((st.lightbox || 0) * 1) + ' 度/天 · 沒電作物不長'], ['ac', '寒潮期間 2 度/天 · 取暖']];
  let any = false;
  for (const [k, d] of devs) {
    if (!(st[k] > 0)) continue; any = true;
    h += '<div class="item"><div><div class="nm">' + ITEMS[k].n + (sv.dev[k] ? '<span class="tag green">開</span>' : '<span class="tag">關</span>') + '</div><div class="meta">' + d + '</div></div>' +
      '<button class="btn ghost" data-a="toggle" data-v="' + k + '">' + (sv.dev[k] ? '關掉' : '打開') + '</button></div>';
  }

};
const hasT = k => !!(S && S.sv && S.sv.talents[k]);
const staCost = v => Math.round(v * (hasT('stamina') ? 0.75 : 1));

function snapshot() {
  if (!S.snaps) S.snaps = [];
  S.snaps.push({ day: S.sv.day, sv: JSON.stringify(S.sv) });
  if (S.snaps.length > 7) S.snaps.shift();
}

function commitRun() {
  const res = S && S.result;
  if (!res || res.committed) return;
  res.committed = true;
  J.pp += res.pp;
  J.best = Math.max(J.best || 0, res.days);
  J.runs.unshift({ n: J.runs.length + 1, days: res.days, cause: res.cause });
  J.runs = J.runs.slice(0, 20);
  if (res.causeKey) J.tips[res.causeKey] = true;
  if (res.hordesSeen > J.hordesSeen) J.hordesSeen = res.hordesSeen;
  if (res.coldSeen) J.tips.coldKnown = true;
  if (res.rainSeen) J.tips.rainKnown = true;
  if (res.days >= 100) J.save.wins = (J.save.wins || 0) + 1;
  else {
    J.save.revivals -= 1;
    if (J.save.revivals < 0) {
      J.save = { no: J.save.no + 1, revivals: 3, wins: 0 };
      J.pp = 0; J.upg = { time: 0, money: 0, bag: 0 };
      J.saveOverNote = true;
    }
  }
  saveJournal();
}

const DISASTERS = ['leak', 'rats', 'sick', 'surge', 'roof'];

function knownRecipes() { const sv = S.sv; return Object.keys(RECIPES).filter(k => RECIPES[k].base || sv.recipes.includes(k)); }
function canCraft(k) { const r = RECIPES[k], st = S.sv.st; return Object.entries(r.need).every(([m, n]) => (st[m] || 0) >= n); }
function hotpotPool() { return ['veg', 'tomato_p', 'mushroom', 'straw_p', 'can', 'sausage'].reduce((a, k) => a + sv_has(k), 0); }
function vegPool() { return VEGGIES.reduce((a, k) => a + sv_has(k), 0); }
function takeFrom(list, n) { for (const k of list) { const t = Math.min(sv_has(k), n); if (t) { sv_take(k, t); n -= t; } if (n <= 0) break; } }

function m4Init(sv) {
  sv.traps = []; sv.sp = 0; sv.talents = {}; sv.sick = 0;
  const locked = Object.keys(RECIPES).filter(k => !RECIPES[k].base);
  const drawn = [];
  const pool = locked.slice();
  for (let i = 0; i < 2 && pool.length; i++) drawn.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  const remembered = locked.filter(k => J.recipes[k]);
  sv.recipes = Array.from(new Set([...remembered, ...drawn]));
  const fresh = drawn.filter(k => !J.recipes[k]);
  for (const k of drawn) J.recipes[k] = true;
  saveJournal();
  if (drawn.length) slog('你在抽屜裡翻到圖紙：' + drawn.map(k => RECIPES[k].n).join('、') + (fresh.length ? '（新的，已抄進日誌）' : '') + '。');
}

Object.assign(SACT, {
  craft(k) {
    const sv = S.sv, r = RECIPES[k];
    const ch = craftHours(r.h), cs = craftSta(r.h);
    if (!r || !knownRecipes().includes(k) || !canCraft(k) || !canAct(ch, cs) || (r.defLv && defLv() < r.defLv) || (r.noStudent && S.char === 'student')) return;
    for (const [m, n] of Object.entries(r.need)) { sv.st[m] -= n; if (!sv.st[m]) delete sv.st[m]; }
    if (r.trap) { const t = TRAPS[r.trap]; sv.traps.push({ k: r.trap, uses: t.uses }); }
    if (r.out) for (const [o, n] of Object.entries(r.out)) sv.st[o] = (sv.st[o] || 0) + n;
    sv.sta -= cs; sv.crafted = (sv.crafted || 0) + 1;
    const lvBefore = lvOf(sv.crafted - 1, CRAFT_LV);
    slog('在工作台做好了' + r.n + '。' + (craftLv() > lvBefore ? ' 製作熟練度升到 ' + craftLv() + ' 級！' : ''));
    passHours(ch); render();
  },
  cookx(k) {
    const sv = S.sv, c = COOKS[k];
    if (!c || !canAct(1, staCost(5)) || !(sv.st.microwave > 0) || sv.power < c.power) return;
    if (k === 'rice') { if (!(sv.st.rice > 0)) return; sv.st.rice--; if (!sv.st.rice) delete sv.st.rice; sv_addFresh('rice_c', 8); }
    if (k === 'soup') { if (vegPool() < 1 || sv.st.wu < 1) return; takeFrom(VEGGIES, 1); sv.st.wu -= 1; sv_addFresh('soup', 2); }
    if (k === 'hotpot') { if (hotpotPool() < 2) return; takeFrom(['veg', 'tomato_p', 'mushroom', 'straw_p', 'sausage', 'can'], 2); sv_addFresh('hotpot', 1); }
    sv.power -= c.power; sv.sta -= staCost(5);
    slog('用微波爐做了' + c.n + '。');
    passHours(1); render();
  },
  talent(k) {
    const sv = S.sv, t = TALENTS[k];
    if (!t || sv.talents[k] || sv.sp < t.cost) return;
    sv.sp -= t.cost; sv.talents[k] = true;
    slog('學會天賦：' + t.n + '（' + t.d + '）。'); render();
  },
  rewind(i) {
    const s = S.snaps && S.snaps[Number(i)];
    if (!s || J.pp < REWIND_COST || !S.result || S.result.committed) return;
    J.pp -= REWIND_COST; saveJournal();
    S.sv = JSON.parse(s.sv);
    S.snaps = S.snaps.slice(0, Number(i) + 1);
    S.phase = 'survive'; S.result = null;
    UI = { tab: 'act', qty: {} };
    slog('你翻開日誌，回到第 ' + s.day + ' 天早上。這次要做得不一樣。', true);
    render(); window.scrollTo(0, 0);
  }
});

// 每天早上的隨機天災
function morningDisaster(nd) {
  const sv = S.sv, st = sv.st;
  if (nd === 49) { sv.sick = 3; slog('你發燒了，渾身無力。生病時體力回得慢，也沒力氣加固防線。', true); chron(nd, '生病了，偏偏後天就是大屍潮。', 'bad'); return; }
  if (nd < 5 || Math.random() > 0.12) return;
  const k = DISASTERS[Math.floor(Math.random() * DISASTERS.length)];
  if (k === 'leak' && st.wu > 0) { const n = Math.min(st.wu, 4); st.wu -= n; slog('水管爆裂，流失了 ' + n + ' 份水。', true); chron(nd, '水管爆裂，流失 ' + n + ' 份水。', 'bad'); }
  else if (k === 'rats') {
    const pool = ['biscuit', 'sausage', 'noodle', 'can', 'rice'].filter(x => st[x] > 0);
    if (pool.length) { const x = pool[Math.floor(Math.random() * pool.length)]; const n = Math.min(st[x], 1 + Math.floor(Math.random() * 3)); st[x] -= n; if (!st[x]) delete st[x]; slog('老鼠咬壞了' + ITEMS[x].n + ' ×' + n + '。', true); chron(nd, '鼠患，損失' + ITEMS[x].n + ' ×' + n + '。', 'bad'); }
  }
  else if (k === 'sick' && !sv.sick) { sv.sick = 3; slog('你著涼生病了（3 天）。吃止痛藥可以提早好。', true); chron(nd, '生病 3 天。', 'bad'); }
  else if (k === 'surge' && sv.power > 0) { sv.power = 0; slog('電線走火跳電，存電全部歸零。', true); chron(nd, '電線走火，存電歸零。', 'bad'); }
  else if (k === 'roof' && inRain(nd)) { sv.mor = clamp(sv.mor - 10); slog('屋頂漏雨，滿地是水。心態 -10。', true); }
}

function rollLoot(table) {
  const total = table.reduce((a, r) => a + r[3], 0);
  let x = Math.random() * total;
  for (const r of table) { x -= r[3]; if (x <= 0) return [r[0], r[1] + Math.floor(Math.random() * (r[2] - r[1] + 1))]; }
  return [table[0][0], table[0][1]];
}

  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  sv.offers = out.map(t => ({ give: t.give, get: [t.get[0], t.get[1] + (S.char === 'manager' ? 1 : 0)], done: false }));
}

// 每天早上：Zoe、倉庫經理、補貨、交易
function m5Morning(nd) {
  const sv = S.sv, z = sv.zoe, m = sv.mgr;
  if (z.state === 'wait' && nd >= 2) { z.state = 'asking'; z.want = pick(ZOE_WANTS); slog('隔壁的 Zoe 敲牆：「拜託，可以分我一點' + ITEMS[z.want].n + '嗎？」', true); chron(nd, '鄰居 Zoe 開始向你求助。'); }
  else if (z.state === 'asking') {
    if (z.today) z.miss = 0; else z.miss++;
    z.today = false;
    if (z.miss >= 3) { z.state = 'gone'; slog('隔壁再也沒有聲音了。', true); chron(nd, '你沒再幫 Zoe，她不見了。', 'bad'); }
    else { z.want = pick(ZOE_WANTS); slog('Zoe 今天想要：' + ITEMS[z.want].n + '。'); }
  }
  if (m.state === 'feeding') {
    if (m.today) m.miss = 0; else m.miss++;
    m.today = false;
    if (m.miss >= 3) { m.state = 'gone'; chron(nd, '貨車裡的倉庫經理沒撐下去。', 'bad'); }
  }
  if (nd % 7 === 0) { for (const k of Object.keys(sv.locs)) sv.locs[k].done = sv.locs[k].done.slice(2); slog('外面的地方又被翻動過，可能有新的東西。'); }
  newOffers();
}

Object.assign(SACT, {
  goOut(loc) {
    const sv = S.sv, L = LOCS[loc];
    if (!L || sv.out || expLevel(sv.xp) < L.lv || !canAct(L.trip, staCost(10))) return;
    sv.sta -= staCost(10);
    const conts = L.cont.map((n, i) => ({ n, i }));
    if (expLevel(sv.xp) >= 4) conts.push({ n: '上鎖的房間', i: 'lock' });
    if (loc === 'smarket' && sv.day >= 18 && expLevel(sv.xp) >= 2 && sv.mgr.state === 'none') conts.push({ n: '貨車駕駛座', i: 'truck' });
    sv.out = { loc, exp: 0, bag: {}, conts };
    slog('你帶上背包，悄悄出門前往' + L.n + '（' + L.trip + ' 小時）。');
    passHours(L.trip); render(); window.scrollTo(0, 0);
  },
  search(i) {
    const sv = S.sv, o = sv.out;
    if (!o || S.phase !== 'survive') return;
    const key = String(i), Lst = sv.locs[o.loc];
    if (Lst.done.includes(key) || !canAct(1, staCost(5))) return;
    const lv = expLevel(sv.xp);
    let exp = 20 - lv * 2 + Math.floor(Math.random() * 11) - 5;
    if (sv.hour >= 18) exp *= 2;
    o.exp += exp; sv.sta -= staCost(5); sv.xp += 1;
    Lst.done.push(key);
    let found = [];
    if (key === 'truck') {
      sv.mgr.state = 'feeding'; sv.mgr.today = true;
      slog('貨車駕駛座裡有個受傷的男人，自稱倉庫經理。他需要有人每天空投食物。', true);
      chron(sv.day, '在廢棄超市的貨車裡找到倉庫經理。');
    } else if ((o.loc === 'school' && key === '4' && expLevel(sv.xp) >= 2 && !sv.clues.includes('lab')) || (o.loc === 'tech' && key === '2' && !sv.clues.includes('server')) || (o.loc === 'hospital' && key === 'lock' && !sv.clues.includes('rec'))) {
      const c = o.loc === 'school' ? 'lab' : o.loc === 'tech' ? 'server' : 'rec';
      sv.clues.push(c); J.clues[c] = true; saveJournal();
      slog('你找到一條線索：' + CLUES[c], true);
      chron(sv.day, '找到真相碎片（' + sv.clues.length + '/3）。');
      found.push('真相碎片');
    } else if (key === '3' && o.loc === 'school' && !(sv.st.drone > 0) && !o.bag.drone) {
      o.bag.drone = 1; found.push('教學無人機');
    } else {
      const rolls = key === 'lock' ? 1 : 1 + (Math.random() < 0.35 ? 1 : 0);
      for (let r = 0; r < rolls; r++) {
        const [k, q] = rollLoot(key === 'lock' ? LOCKED_LOOT : LOCS[o.loc].loot);
        const room = bagCap() - outWeight();
        const fit = outW(k) > 0 ? Math.min(q, Math.floor(room / outW(k))) : q;
        if (fit <= 0) { found.push(ITEMS[k] ? ITEMS[k].n + '（背包滿了，帶不走）' : '東西（帶不走）'); continue; }
        o.bag[k] = (o.bag[k] || 0) + fit;
        found.push((k === 'bp' ? '一張圖紙' : ITEMS[k].n) + ' ×' + fit);
      }
    }
    if (found.length) slog('搜了' + o.conts.find(c => String(c.i) === key).n + '：' + found.join('、') + '。');
    else if (key !== 'truck') slog('什麼都沒找到。');
    const before = expLevel(sv.xp - 1), after = expLevel(sv.xp);
    if (after > before) slog('探索等級升到 ' + after + '！' + (after === 2 ? '可以去醫院了。' : after === 3 ? '可以去科技公司了。' : '能打開上鎖的房間了。'), true);
    passHours(1);
    if (S.phase === 'survive' && o.exp >= 100) ambush();
    render();
  },
  goHome() {
    const sv = S.sv, o = sv.out;
    if (!o) return;
    const trip = LOCS[o.loc].trip;
    bringHome(o.bag);
    sv.out = null;
    passHours(trip);
    if (sv.hour > LAST_HOUR) sv.hour = LAST_HOUR;
    render(); window.scrollTo(0, 0);
  },
  zoe() {
    const sv = S.sv, z = sv.zoe;
    if (z.state !== 'asking' || z.today || sv_has(z.want) < 1 && !(z.want === 'wu' && sv.st.wu >= 1)) return;
    if (z.want === 'wu') sv.st.wu -= 1; else sv_take(z.want, 1);
    z.today = true; z.given++; sv.mor = clamp(sv.mor + 5);
    if (z.given >= 7) {
      z.state = 'saved';
      sv.st.fert = (sv.st.fert || 0) + 2; sv.st.tomato = (sv.st.tomato || 0) + 2;
      if (!J.chars.student) { J.chars.student = true; saveJournal(); }
      slog('Zoe 撐過來了！她送你肥料和種子，還說下次換她來幫你。（解鎖角色：大學生）', true);
      chron(sv.day, '救下 Zoe，解鎖大學生。', 'good');
    } else slog('你把' + ITEMS[z.want].n + '從牆洞遞過去。Zoe：「謝謝……」（' + z.given + '/7）');
    render();
  },
  airdrop() {
    const sv = S.sv, m = sv.mgr;
    if (m.state !== 'feeding' || m.today || !(sv.st.drone > 0)) return;
    const foods = ['biscuit', 'can', 'sausage', 'noodle', 'choco', 'veg', 'tomato_p', 'straw_p', 'mushroom', 'juice'];
    if (foods.reduce((a, k) => a + sv_has(k), 0) < 2) { slog('能空投的食物不夠 2 份。'); render(); return; }
    takeFrom(foods, 2);
    m.today = true; m.fed++;
    if (m.fed >= 5) {
      m.state = 'saved';
      sv.st.metal = (sv.st.metal || 0) + 4; sv.st.diesel = (sv.st.diesel || 0) + 1;
      if (!J.chars.manager) { J.chars.manager = true; saveJournal(); }
      slog('倉庫經理靠自己走到安全區了，臨走前用無人機回送鐵片和柴油。（解鎖角色：倉庫經理）', true);
      chron(sv.day, '救下倉庫經理，解鎖角色。', 'good');
    } else slog('無人機把 2 份食物空投到貨車（' + m.fed + '/5）。');
    render();
  },
  trade(i) {
    const sv = S.sv, o = sv.offers[Number(i)];
    if (!o || o.done || !(sv.st.drone > 0)) return;
    const [gk, gq] = o.give;
    if (sv_has(gk) < gq) return;
    sv_take(gk, gq);
    const [k, q] = o.get;
    if (k === 'wu') sv.st.wu += q; else sv.st[k] = (sv.st[k] || 0) + q;
    o.done = true; sv.trades++;
    slog('無人機交易：' + ITEMS[gk].n + '×' + gq + ' 換到 ' + ITEMS[k].n + '×' + q + '。' + (sv.trades === 5 ? '對方開始願意用柴油交換了。' : ''));
    render();
  },
  juice() {
    const sv = S.sv;
    if (!(sv.st.juicer > 0) || vegPool() < 2 || !canAct(1, staCost(3))) return;
    takeFrom(VEGGIES, 2); sv.st.juice = (sv.st.juice || 0) + 1; sv.sta -= staCost(3);
    slog('榨了一瓶果汁。很適合拿去交易。');
    passHours(1); render();
  },
  pickChar(k) { if (!J.chars[k]) return; J.char = k; saveJournal(); render(); }
});

function outWeight() { const o = S.sv.out; return o ? Object.entries(o.bag).reduce((a, [k, q]) => a + outW(k) * q, 0) : 0; }
function bringHome(bag) {
  const sv = S.sv, got = [];
  for (const [k, q] of Object.entries(bag)) {
    if (k === 'bp') {
      for (let i = 0; i < q; i++) {
        const locked = Object.keys(RECIPES).filter(r => !RECIPES[r].base && !sv.recipes.includes(r));
        if (locked.length) { const r = pick(locked); sv.recipes.push(r); J.recipes[r] = true; saveJournal(); got.push('圖紙「' + RECIPES[r].n + '」'); }
        else { sv.st.plastic = (sv.st.plastic || 0) + 2; got.push('塑膠×2（圖紙都有了）'); }
      }
      continue;
    }
    let fit = q;
    if (k !== 'wu' && ITEMS[k].cat !== 'equip' && ITEMS[k].w > 0) fit = Math.max(0, Math.min(q, Math.floor((storeCap() - storeWeight()) / ITEMS[k].w)));
    if (fit < q) got.push(ITEMS[k].n + '×' + (q - fit) + '（倉庫放不下，丟在門口）');
    if (!fit) continue;
    if (k === 'wu') sv.st.wu += fit; else sv.st[k] = (sv.st[k] || 0) + fit;
    got.push(ITEMS[k].n + '×' + fit);
  }
  slog(got.length ? '平安回家，帶回 ' + got.join('、') + '。' : '空手回家。');
  if (bag.drone) newOffers();
}
function ambush() {
  const sv = S.sv, o = sv.out;
  hurt(20, 'ambush'); sv.mor = clamp(sv.mor - 10);
  for (const k of Object.keys(o.bag)) { o.bag[k] = Math.floor(o.bag[k] / 2); if (!o.bag[k]) delete o.bag[k]; }
  slog('動靜太大，被屍群包圍了！你丟下一半的東西逃回家，生命 -20。', true);
  chron(sv.day, '在' + LOCS[o.loc].n + '被屍群包圍，負傷逃回。', 'bad');
  if (checkDeath()) return;
  bringHome(o.bag);
  sv.out = null;
  passHours(LOCS[o.loc].trip);
}

function m6Init(sv) {
  sv.floors = ['1F']; sv.rooms = []; sv.defXp = 0; sv.crafted = 0; sv.clues = []; sv.endless = false;
}
const roomN = k => (S.sv.rooms || []).filter(r => r === k).length;
const defLv = () => lvOf(S.sv.defXp || 0, DEF_LV);
const craftLv = () => lvOf(S.sv.crafted || 0, CRAFT_LV);
const powerMul = () => roomN('powerroom') ? 1.2 : 1;
function storeCap() { return 200 + roomN('storage') * 150; }
function storeWeight() { const st = S.sv.st; return Object.entries(st).reduce((a, [k, q]) => a + (k === 'wu' || !ITEMS[k] || ITEMS[k].cat === 'equip' ? 0 : ITEMS[k].w * q), 0); }
function craftHours(h) { return Math.max(1, h - (roomN('workshop') ? 1 : 0) - (craftLv() >= 3 ? 1 : 0)); }
function craftSta(h) { return Math.round(staCost(8 * h) * (craftLv() >= 2 ? 0.75 : 1)); }
function roomSlots() { return S.sv.floors.length * 3; }

Object.assign(SACT, {
  buildFloor(k) {
    const sv = S.sv, f = FLOORS[k];
    if (!f || sv.floors.includes(k) || !Object.entries(f.need).every(([m, n]) => (sv.st[m] || 0) >= n) || !canAct(f.h, staCost(30))) return;
    for (const [m, n] of Object.entries(f.need)) { sv.st[m] -= n; if (!sv.st[m]) delete sv.st[m]; }
    sv.floors.push(k); sv.sta -= staCost(30);
    slog('花了 ' + f.h + ' 小時打通了' + f.n + '，多了 3 個房間位置。', true);
    chron(sv.day, '擴建' + f.n + '。', 'good');
    passHours(f.h); render();
  },
  buildRoom(k) {
    const sv = S.sv, r = ROOMS[k];
    if (!r || sv.rooms.length >= roomSlots() || !Object.entries(r.need).every(([m, n]) => (sv.st[m] || 0) >= n) || !canAct(r.h, staCost(15))) return;
    for (const [m, n] of Object.entries(r.need)) { sv.st[m] -= n; if (!sv.st[m]) delete sv.st[m]; }
    sv.rooms.push(k); sv.sta -= staCost(15);
    slog('蓋好了' + r.n + '：' + r.d + '。');
    passHours(r.h); render();
  },
  brew() {
    const sv = S.sv;
    const fruits = ['tomato_p', 'straw_p'];
    if (!(sv.st.brewer > 0) || fruits.reduce((a, k) => a + sv_has(k), 0) < 3 || !canAct(2, staCost(5))) return;
    takeFrom(fruits, 3); sv.st.alcohol = (sv.st.alcohol || 0) + 1; sv.sta -= staCost(5);
    slog('釀出一瓶高度酒。可以拿來做燃燒瓶。');
    passHours(2); render();
  },
  endless() {
    if (!S.result || !S.result.canEndless) return;
    S.sv.endless = true; S.phase = 'survive'; S.result = null;
    slog('你決定留下來。屍潮還會一波比一波強，看你能撐多久。', true);
    chron(S.sv.day, '進入無盡模式。');
    render(); window.scrollTo(0, 0);
  }
});

function pickEnding(sv) {
  const saved = (sv.zoe.state === 'saved' ? 1 : 0) + (sv.mgr.state === 'saved' ? 1 : 0);
  const truth = sv.clues.length >= 3;
  if (truth && saved >= 2) return 'dawn';
  if (truth) return 'truth';
  if (saved >= 1) return 'community';
  return 'alone';
}

function viewBuild() {
  const sv = S.sv, st = sv.st;
  const has = need => Object.entries(need).every(([m, n]) => (st[m] || 0) >= n);
  const needTxt = need => Object.entries(need).map(([m, n]) => ITEMS[m].n + ' ' + (st[m] || 0) + '/' + n).join('、');
  let h = '<div class="cat">據點擴建（' + sv.floors.map(f => f === '1F' ? '一樓' : FLOORS[f].n).join('、') + '）</div>';
  h += '<p class="empty">房間 ' + sv.rooms.length + '/' + roomSlots() + '：' + (sv.rooms.length ? sv.rooms.map(r => ROOMS[r].n).join('、') : '還沒蓋') + ' · 倉庫 ' + Math.round(storeWeight()) + '/' + storeCap() + 'kg</p><div class="sheet">';
  for (const [k, f] of Object.entries(FLOORS)) if (!sv.floors.includes(k)) h += actRow('擴建' + f.n, '+3 個房間位置 · ' + needTxt(f.need) + ' · ' + f.h + ' 小時 · 體力 -' + staCost(30), '擴建', 'buildFloor', k, has(f.need) && canAct(f.h, staCost(30)));
  for (const [k, r] of Object.entries(ROOMS)) h += actRow('蓋' + r.n + (roomN(k) ? '<span class="tag green">已有 ' + roomN(k) + '</span>' : ''), r.d + ' · ' + needTxt(r.need) + ' · ' + r.h + ' 小時', '蓋', 'buildRoom', k, sv.rooms.length < roomSlots() && has(r.need) && canAct(r.h, staCost(15)));
  h += '</div>';
  return h;
}

/* ================= 事件綁定 ================= */
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.getAttribute('data-a');
  if (ACT[a]) ACT[a](b.getAttribute('data-v'));
  else if (SACT[a]) SACT[a](b.getAttribute('data-v'));
});

// 數量直接輸入：只更新數值、不重畫，避免手機上點「買」時按鈕被重畫吃掉
function setQtyFromInput(el) {
  const k = el.getAttribute('data-qty');
  const v = Math.floor(Number(el.value));
  UI.qty[k] = Math.max(1, Math.min(99, isFinite(v) && v > 0 ? v : 1));
}
$app.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-qty]') && e.target.value !== '') setQtyFromInput(e.target); });
$app.addEventListener('change', e => { if (e.target.matches && e.target.matches('[data-qty]')) { setQtyFromInput(e.target); e.target.value = UI.qty[e.target.getAttribute('data-qty')]; } });
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-qty]')) {
    setQtyFromInput(e.target);
    const btn = $app.querySelector('[data-a="buy"][data-v="' + e.target.getAttribute('data-qty') + '"]');
    if (btn && !btn.disabled) btn.click();
  }
});

function start(data) {
  if (data && data.S) { S = data.S; UI = data.UI || { tab: 'here', qty: {} }; }
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S, UI }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

// 給測試用
window.__slog = { simulate, get S() { return S; }, ACT, get SACT() { return SACT; } };
})();
</script>
